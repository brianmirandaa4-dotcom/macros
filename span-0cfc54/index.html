<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SPAN · ELEG 607</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0D1022">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SPAN">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
/* SPAN — "night reading book": deep ink-blue pages, big rounded type, one chalk color per unit
   (unit colors follow the chalk on his boards: 8/27 was orange-red). His ink code for SVD work: blue = first r, red = the rest, green = result. */
:root{
  color-scheme: dark;
  --bg:#0D1022; --bg2:#121632; --card:#191E3F; --card2:#21274E; --line:rgba(178,186,255,.13); --line2:rgba(178,186,255,.24);
  --fg:#F4F2FF; --soft:#CACCEB; --muted:#9295BE; --faint:#5F638E;
  --unit:#FF8A65; --unit-ink:#2A1208;
  --ok:#6EE7A8; --ok-bg:rgba(110,231,168,.14); --no:#FF8B8B; --no-bg:rgba(255,139,139,.14); --warn:#FFC857;
  --blu:#7FB2FF; --red:#FF8BA0; --grn:#6EE7A8;
  --f-ui: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-text: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-math: "SF Pro Text", -apple-system, system-ui, "Helvetica Neue", Arial, sans-serif;
  --f-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r-lg:30px; --r-md:22px; --r-sm:14px;
  --ease: cubic-bezier(.2,.8,.2,1); --t: 200ms;
  --tab-h: 64px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-text);font-size:19px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--unit);outline-offset:3px;border-radius:12px}
[hidden]{display:none!important}

/* ── layout ── */
.app{min-height:100%;padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 24px)}
.page{max-width:760px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:20px 12px;display:grid;gap:18px}
.view-enter{animation:viewIn var(--t) var(--ease)}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}}

.topbar{display:flex;align-items:center;gap:12px;min-height:44px}
.topbar h1{margin:0;font:800 30px/1.1 var(--f-ui);letter-spacing:-.5px;text-wrap:balance}
.back{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--card);display:grid;place-items:center;cursor:pointer;font-size:22px}
.eyebrow{font:700 13px var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--unit)}
.sub{color:var(--muted);font-size:16px;margin:0}
h2{font:800 23px/1.2 var(--f-ui);margin:4px 0 0;letter-spacing:-.3px;text-wrap:balance}
h3{font:800 19px/1.25 var(--f-ui);margin:0;text-wrap:balance}
p{margin:0}
.lead{font-size:20px;line-height:1.55;color:var(--fg)}
.small{font-size:15px;color:var(--muted)}
code,.code{font-family:var(--f-mono);font-size:.88em;background:rgba(255,255,255,.07);border-radius:8px;padding:1px 6px}

/* ── bubbles ── */
.bubble{background:var(--card);border-radius:var(--r-lg);padding:22px;display:grid;gap:14px;min-width:0}
.bubble.soft{background:var(--bg2);border:1px solid var(--line)}
.bubble.tint{background:color-mix(in srgb,var(--unit) 13%,var(--card))}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.spacer{flex:1}

/* ── buttons ── */
.btn{min-height:52px;padding:0 22px;border-radius:999px;border:0;background:var(--card2);color:var(--fg);font:700 18px var(--f-ui);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:10px;transition:transform 150ms var(--ease),background 150ms}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--unit);color:var(--unit-ink)}
.btn.ghost{background:transparent;border:1.5px solid var(--line2)}
.btn.small{min-height:44px;padding:0 16px;font-size:16px}
.btn.block{width:100%}
.btn:disabled{opacity:.4;cursor:default}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:0 12px;border-radius:999px;background:rgba(255,255,255,.07);font:700 13px var(--f-ui);color:var(--soft);white-space:nowrap}
.chip.unit{background:color-mix(in srgb,var(--unit) 20%,transparent);color:var(--unit)}
.chip.star{background:rgba(255,200,87,.16);color:var(--warn)}
.chip.sup{background:rgba(127,178,255,.14);color:var(--blu)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.no{background:var(--no-bg);color:var(--no)}

/* ── tab bar ── */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(13,16,34,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
.tabs nav{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tab-h)}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font:700 12px var(--f-ui);cursor:pointer;min-height:44px;position:relative}
.tab svg{width:26px;height:26px}
.tab[aria-current="page"]{color:var(--fg)}
.tab[aria-current="page"]::after{content:"";position:absolute;top:0;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--unit)}
.tab .dot{position:absolute;top:8px;left:calc(50% + 8px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--no);color:#2a0a0a;font:800 11px/18px var(--f-ui)}

/* ── home ── */
.hello{display:grid;gap:4px}
.hello h1{font:800 34px/1.05 var(--f-ui);letter-spacing:-.8px;margin:0}
.count{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.count .big{font:800 44px/1 var(--f-ui);font-variant-numeric:tabular-nums;letter-spacing:-1px;color:var(--unit)}
.count .big small{font-size:18px;color:var(--soft);font-weight:700;margin-left:4px}
.queue .big{font:800 48px/1 var(--f-ui);font-variant-numeric:tabular-nums}
.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 12px;display:grid;gap:2px;text-align:left;cursor:pointer;color:var(--fg);min-height:44px}
.stat b{font:800 28px/1 var(--f-ui);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted);font-weight:700}
.rings{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:12px}
.ringcard{border:0;background:var(--bg2);border-radius:var(--r-md);padding:12px 8px 12px;display:grid;justify-items:center;gap:6px;cursor:pointer;color:var(--fg);min-height:44px}
.ringcard.locked{opacity:.5;padding:8px 6px}
.ringcard.locked .ring{width:46px;height:46px}
.ringcard .rn{font:700 12px var(--f-ui);color:var(--muted);text-align:center;line-height:1.25}
.ring{width:66px;height:66px}
.ring circle{fill:none;stroke-width:7}
.ring .track{stroke:rgba(255,255,255,.08)}
.ring .val{stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset 900ms var(--ease)}
.ring text{fill:var(--fg);font:800 17px var(--f-ui);text-anchor:middle;dominant-baseline:central}

/* ── lists ── */
.list{display:grid;gap:10px}
.li{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;width:100%;text-align:left;border:0;background:var(--card);border-radius:var(--r-md);padding:14px 16px;min-height:64px;cursor:pointer;color:var(--fg)}
.li .num{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:800 16px var(--f-ui);background:rgba(255,255,255,.06);color:var(--soft)}
.li.done .num{background:var(--ok-bg);color:var(--ok)}
.li.next .num{background:var(--unit);color:var(--unit-ink)}
.li.locked{opacity:.45;cursor:default}
.li .t{font:800 18px/1.25 var(--f-ui)}
.li .d{font-size:14px;color:var(--muted)}
.li .go{color:var(--faint);font-size:22px}

/* ── stone viewer ── */
.stone-track{display:grid;gap:16px;touch-action:pan-y}
.stone-in-r{animation:stoneR 240ms var(--ease)}
.stone-in-l{animation:stoneL 240ms var(--ease)}
@keyframes stoneR{from{opacity:0;transform:translateX(36px)}}
@keyframes stoneL{from{opacity:0;transform:translateX(-36px)}}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots i{width:9px;height:9px;border-radius:5px;background:rgba(255,255,255,.14);transition:all 200ms}
.dots i.seen{background:color-mix(in srgb,var(--unit) 55%,transparent)}
.dots i.on{width:26px;background:var(--unit)}
.nick{display:inline-flex;align-items:center;gap:8px;align-self:start;justify-self:start;padding:8px 16px;border-radius:999px;background:color-mix(in srgb,var(--unit) 18%,transparent);color:var(--unit);font:800 16px var(--f-ui)}
.weird{border-radius:var(--r-md);padding:14px 16px;background:rgba(255,200,87,.10);border:1.5px dashed rgba(255,200,87,.45);color:var(--fg);font-size:17px}
.mathbox{background:var(--bg2);border-radius:var(--r-md);padding:18px 14px;overflow-x:auto;border:1px solid var(--line)}
.mathnote{font-size:16px;color:var(--soft)}
.reveal-steps{display:grid;gap:8px}
.stepline{padding:12px 14px;border-radius:var(--r-sm);background:rgba(255,255,255,.04);animation:viewIn var(--t) var(--ease);overflow-x:auto}
.answer{padding:14px 16px;border-radius:var(--r-sm);background:var(--ok-bg);border:1.5px solid color-mix(in srgb,var(--ok) 50%,transparent);overflow-x:auto}
.answer b{display:block;font:800 12px var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--ok);margin-bottom:4px}
.solid{display:grid;gap:12px;padding:20px;border-radius:var(--r-lg);background:color-mix(in srgb,var(--unit) 12%,var(--card));border:1.5px solid color-mix(in srgb,var(--unit) 40%,transparent);text-align:center}
.solid h3{font-size:22px}
.navrow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.src{font:700 13px var(--f-ui);color:var(--faint)}

/* ── questions ── */
.q{display:grid;gap:12px}
.qtext{font:700 20px/1.45 var(--f-ui)}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:center;width:100%;min-height:58px;text-align:left;padding:10px 16px;border-radius:var(--r-md);border:2px solid var(--line2);background:rgba(255,255,255,.03);color:var(--fg);font:600 18px/1.35 var(--f-text);cursor:pointer;transition:border-color 150ms,background 150ms,transform 150ms var(--ease)}
.opt .k{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.08);font:800 14px var(--f-ui);color:var(--soft)}
.opt .ot{min-width:0;overflow-x:auto}
.opt.code .ot{font-family:var(--f-mono);font-size:15.5px}
.opt:not(:disabled):active{transform:scale(.985)}
.opt.right{border-color:var(--ok);background:var(--ok-bg);animation:pop 320ms var(--ease)}
.opt.right .k{background:var(--ok);color:#06210f}
.opt.wrong{border-color:var(--no);background:var(--no-bg);animation:shake 300ms}
.opt.dim{opacity:.5}
.opt:disabled{cursor:default}
@keyframes pop{40%{transform:scale(1.025)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.feedback{border-radius:var(--r-md);padding:14px 16px;font-size:17px;display:grid;gap:4px;animation:viewIn var(--t) var(--ease)}
.feedback.ok{background:var(--ok-bg)} .feedback.no{background:var(--no-bg)}
.feedback b{font:800 16px var(--f-ui)} .feedback.ok b{color:var(--ok)} .feedback.no b{color:var(--no)}
.burst{position:relative}
.burst::after{content:"";position:absolute;inset:-6px;border-radius:inherit;border:3px solid var(--ok);opacity:0;animation:ringOut 500ms var(--ease)}
@keyframes ringOut{0%{opacity:.9;transform:scale(.96)}100%{opacity:0;transform:scale(1.06)}}
.progress{height:8px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}
.progress i{display:block;height:100%;background:var(--unit);border-radius:4px;transition:width 300ms var(--ease)}
pre.jl{margin:0;padding:16px;border-radius:var(--r-md);background:#0A0C1A;border:1px solid var(--line);font:500 15.5px/1.55 var(--f-mono);overflow-x:auto;color:#E8E6FF}
pre.jl .kw{color:#FF9FC0} pre.jl .nu{color:#FFC98A} pre.jl .cm{color:#7E83B0} pre.jl .st{color:#9EE6B8}
.hint{padding:12px 14px;border-radius:var(--r-sm);background:rgba(127,178,255,.10);border-left:4px solid var(--blu);animation:viewIn var(--t) var(--ease);overflow-x:auto}
.hint b{color:var(--blu);font:800 13px var(--f-ui);letter-spacing:.06em;text-transform:uppercase;display:block}

/* ── proof ── */
.pfgoal{padding:14px 16px;border-radius:var(--r-md);background:var(--bg2);border:1px solid var(--line);overflow-x:auto}
.pfline{display:grid;grid-template-columns:32px 1fr;gap:12px;align-items:start;padding:12px 14px;border-radius:var(--r-sm);background:rgba(255,255,255,.04);border:2px solid transparent;text-align:left;width:100%;color:var(--fg);font:inherit;cursor:pointer}
.pfline .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.08);font:800 13px var(--f-ui)}
.pfline .b{min-width:0;overflow-x:auto;display:block}
.pfline .why{display:block;margin-top:4px;font:700 14px var(--f-ui);color:var(--unit)}
.pfline.placed{background:color-mix(in srgb,var(--unit) 10%,transparent);cursor:default}
.pfline.placed .n{background:var(--unit);color:var(--unit-ink)}
.pfline.blank{border:2px dashed var(--line2);color:var(--muted);cursor:default}
.pfline.bad{border-color:var(--no);animation:shake 300ms}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--bg2);border-radius:999px;padding:4px;gap:4px;border:1px solid var(--line)}
.seg button{border:0;background:none;min-height:44px;border-radius:999px;font:700 15px var(--f-ui);color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card2);color:var(--fg)}

/* ── vault ── */
.search{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:999px;padding:0 18px;min-height:52px;border:1.5px solid var(--line)}
.search input{flex:1;min-width:0;background:none;border:0;color:var(--fg);font:600 18px var(--f-text);outline:none;min-height:48px}
.ventry{display:grid;gap:10px}
.ventry .vh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.vmeta{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:16px}
.vmeta dt{font:800 13px/1.9 var(--f-ui);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.vmeta dd{margin:0}
.check{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer}
.check input{width:24px;height:24px;accent-color:var(--unit)}

/* ── math ── */
math{font-family:var(--f-math);font-size:1.18em;math-style:normal}
math mi, math mn, math mtext{font-family:var(--f-math)}
math mi:not([mathvariant]){font-style:italic}
math mi.op{font-style:normal}
.mblock{display:block;overflow-x:auto;padding:4px 0}
.mblock math{font-size:1.22em}
.m-hl{color:var(--unit)} .m-blu{color:var(--blu)} .m-red{color:var(--red)} .m-grn{color:var(--grn)} .m-acc{color:var(--warn)}
math .pr{font-weight:700;padding-left:.07em}
.pfline math,.pfgoal math,.opt math{font-size:1.06em}
math mtable.bm{--bw:.085em;--bt:.32em;border-left:var(--bw) solid currentColor;border-right:var(--bw) solid currentColor;padding:.12em .32em;margin:0 .12em;
  background:linear-gradient(currentColor,currentColor) left top/var(--bt) var(--bw) no-repeat,linear-gradient(currentColor,currentColor) left bottom/var(--bt) var(--bw) no-repeat,
  linear-gradient(currentColor,currentColor) right top/var(--bt) var(--bw) no-repeat,linear-gradient(currentColor,currentColor) right bottom/var(--bt) var(--bw) no-repeat}

/* ── widgets ── */
.widget{display:grid;gap:12px;background:var(--bg2);border-radius:var(--r-md);padding:14px;border:1px solid var(--line)}
.widget svg{width:100%;height:auto;max-width:440px;justify-self:center;touch-action:none;user-select:none;-webkit-user-select:none}
.widget .wcap{font:700 14px var(--f-ui);color:var(--muted)}
.widget .wout{overflow-x:auto;text-align:center}
.slider{display:grid;grid-template-columns:44px 1fr 58px;gap:10px;align-items:center;font:800 16px var(--f-ui)}
.slider input{width:100%;accent-color:var(--unit);height:32px}
.slider output{text-align:right;font-variant-numeric:tabular-nums}
.stepper{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.05);border-radius:999px;padding:3px}
.stepper button{width:44px;height:44px;border-radius:50%;border:0;background:var(--card2);font:800 20px var(--f-ui);cursor:pointer}
.stepper b{min-width:30px;text-align:center;font:800 18px var(--f-ui);font-variant-numeric:tabular-nums}
.cells{display:grid;gap:5px;justify-content:center}
.cell{width:52px;height:46px;border-radius:12px;display:grid;place-items:center;font:800 16px var(--f-ui);font-variant-numeric:tabular-nums;transition:background 200ms}
.badge-perp{color:var(--ok);font-weight:800}
svg .gridline{stroke:rgba(178,186,255,.10);stroke-width:1}
svg .axis{stroke:rgba(178,186,255,.32);stroke-width:1.4}
svg .warp{stroke:color-mix(in srgb,var(--unit) 35%,transparent);stroke-width:1.2}
svg .handle{cursor:grab}
svg text{font:800 15px var(--f-ui)}

/* ── exam ── */
.timer{font:800 26px var(--f-ui);font-variant-numeric:tabular-nums;color:var(--unit)}
.score{font:800 64px/1 var(--f-ui);font-variant-numeric:tabular-nums;color:var(--ok)}
.topicbar{display:grid;grid-template-columns:1fr 70px;gap:10px;align-items:center;font-size:15px}
textarea{width:100%;min-height:120px;border-radius:var(--r-sm);background:var(--bg2);border:1.5px solid var(--line2);color:var(--fg);font:500 14px var(--f-mono);padding:12px}
select{min-height:48px;border-radius:14px;background:var(--card2);color:var(--fg);border:1px solid var(--line2);font:700 17px var(--f-ui);padding:0 12px}
.toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 16px);transform:translateX(-50%);z-index:40;background:var(--fg);color:var(--bg);padding:12px 20px;border-radius:999px;font:800 16px var(--f-ui);animation:viewIn var(--t) var(--ease);max-width:90vw;text-align:center}

/* ── cheat sheet print preview (white, A4) ── */
.sheetbox{width:100%;overflow:hidden;position:relative}
.sheet{background:#fff;color:#111;border-radius:4px;padding:8mm;width:210mm;height:297mm;overflow:hidden;font-size:9pt;line-height:1.3;columns:3;column-gap:4mm;column-fill:balance;box-shadow:0 20px 50px rgba(0,0,0,.4);transform-origin:top left}
.sheet .sh{font:800 9pt var(--f-ui);margin:0 0 2mm;column-span:all;display:flex;justify-content:space-between;border-bottom:1.5px solid #222;padding-bottom:1mm}
.sheet .si{break-inside:avoid;border:1px solid #c9cbe0;border-radius:3px;padding:1.3mm 1.6mm;margin:0 0 1.5mm;overflow:hidden}
.sheet .si b{font-size:8.6pt;display:block}
.sheet .si .sm{font-size:7.6pt;color:#444}
.sheet math{font-size:1em;color:#111}
.sheet .mblock{padding:.5mm 0;overflow:hidden}
.sheet .mblock math{font-size:.98em}
.sheet .m-hl,.sheet .m-acc{color:#B3401D}
.sheetwrap{overflow-x:auto;display:grid;justify-items:center;gap:16px}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
@media (max-width:420px){
  body{font-size:18px}
  .qtext{font-size:19px}

        intuition: "$A'$ flips rows into columns and conjugates every entry. Undoing a product is like taking off socks and shoes: the last thing on comes off first, so the order flips.",

        solution: [R`$x'e_3=x_3=9$ (selects entry 3 of $x$).`, R`$Ae_1=A_{:,1}=\mat{2\\5\\4}$ (selects column 1).`, R`$e_2'A=A_{2,:}=\mat{5&3&1}$ (selects row 2).`, R`$Ae_2=\mat{-1\\3\\0}$, so $e_3'Ae_2=A_{32}=0$ (selects entry (3, 2)).`],

      { id: "u1p5", title: "Ax as a recipe", src: "8/27 board", stone: "u1s8",

        hints: ["Columns: 1 scoop of column 1, 2 of column 2, −1 of column 3.", "Rows: each entry is a row of A matched with x."],
        solution: [R`Columns: $1\mat{2\\-1}+2\mat{0\\3}-1\mat{1\\4}=\mat{2+0-1\\-1+6-4}$.`, R`$Ax=\mat{1\\1}$.`, R`Rows: $2\cdot1+0\cdot2+1\cdot(-1)=1$ and $-1+6-4=1$ ✓.`],

      { id: "u1p6", title: "AB two ways, and BA", src: "8/27 board", stone: "u1s12",

      { id: "u1p7", title: "Complex match score and length", src: "8/27 board", stone: "u1s4",

        solution: [R`$y'x=(-i)(1+i)+1\cdot2=-i-i^2+2=3-i$.`, R`$x'y=(3-i)^{*}=3+i$.`, R`$\norm{x}^2=2+4=6$, so $\norm{x}=\sqrt6$.`],

      { id: "u1p8", title: "SVD as outer products", src: "HW1 P3 (Fessler 2.3)", stone: "u1s16",
        q: R`$A=U\Sigma V'$ with $U\in\R^{2\times2}$, $\Sigma=\mat{\sigma_1&0&0\\0&\sigma_2&0}$, $V\in\R^{3\times3}$ (so $M=2<N=3$). Write $A$ as a sum of outer products. How many terms?`,
        hints: [R`Think of $U$ as a row of columns and $V'$ as a column of rows.`, R`$\Sigma V'$ keeps only the first 2 rows of $V'$, scaled by $\sigma_1,\sigma_2$.`],
        solution: [R`$\Sigma V'=\mat{\sigma_1V_{:,1}'\\\sigma_2V_{:,2}'}$ (the third row of $V'$ is multiplied by a zero column).`, R`$U(\Sigma V')=U_{:,1}\sigma_1V_{:,1}'+U_{:,2}\sigma_2V_{:,2}'$ (inner product of outer products).`, "Two terms = min(M, N); only rank(A) of them are nonzero."],
        answer: R`$A=\sigma_1U_{:,1}V_{:,1}'+\sigma_2U_{:,2}V_{:,2}'$` },
      { id: "u1p9", title: "Block products", src: "HW1 P4 (Fessler 2.7)", stone: "u1s13",

        solution: [R`(b) $\mat{AC&AD\\BC&BD}$: block outer product.`, R`(c) $\mat{AB&AC&AD}$: like scaling from the left.`, R`(d) $\mat{AD\\BD\\CD}$: like scaling from the right.`],

      { id: "u1p10", title: "Cost of a product chain", src: "HW1 P5 (Fessler 2.8)", stone: "u1s17",

        hints: ["Find the inner products hiding in the chain.", "Count: each inner product, the scalar product, then scaling z."],

  proofs: {
    u1: [
      { id: "u1pr1", title: "Inner product is linear in x", src: "HW1 P6", star: true,
        goal: R`Show $f(x,y)=y'x$ is linear in $x$: $f(\alpha x+\beta z,y)=\alpha f(x,y)+\beta f(z,y)$.`,
        steps: [
          { line: R`Let $\alpha,\beta\in\C$ and $x,z,y\in\C^n$.`, why: "Name everything arbitrary first" },
          { line: R`$f(\alpha x+\beta z,y)=y'(\alpha x+\beta z)$`, why: "Definition of f" },
          { line: R`$=y'(\alpha x)+y'(\beta z)$`, why: "Matrix multiplication distributes" },
          { line: R`$=\alpha\,y'x+\beta\,y'z$`, why: "Scalars pull out of a product: A(αB) = α(AB)" },
          { line: R`$=\alpha f(x,y)+\beta f(z,y)$`, why: "Definition of f" }
        ],
        whyPool: ["Transpose of a sum", "(αA)′ = α*A′", "Socks and shoes", "Norm property ②"],
        fillDistract: [R`$=\alpha^{*}y'x+\beta^{*}y'z$`, R`$=x'(\alpha y)+z'(\beta y)$`] },
      { id: "u1pr2", title: "Inner product is conjugate-linear in y", src: "HW1 P6", star: true,
        goal: R`Show $f(x,y)=y'x$ is conjugate-linear in $y$: $f(x,\alpha y+\beta z)=\alpha^{*}f(x,y)+\beta^{*}f(x,z)$.`,
        steps: [
          { line: R`Let $\alpha,\beta\in\C$ and $x,y,z\in\C^n$.`, why: "Name everything arbitrary first" },
          { line: R`$f(x,\alpha y+\beta z)=(\alpha y+\beta z)'x$`, why: "Definition of f" },
          { line: R`$=(\alpha^{*}y'+\beta^{*}z')x$`, why: "Transpose of a sum, then (αA)′ = α*A′" },
          { line: R`$=\alpha^{*}y'x+\beta^{*}z'x$`, why: "Matrix multiplication distributes" },
          { line: R`$=\alpha^{*}f(x,y)+\beta^{*}f(x,z)$`, why: "Definition of f" }
        ],
        whyPool: ["Socks and shoes", "Scalars pull out of a product: A(αB) = α(AB)", "(A′)′ = A", "Cauchy–Schwarz"],
        fillDistract: [R`$=(\alpha y'+\beta z')x$`, R`$=x'(\alpha y+\beta z)$`] },
      { id: "u1pr3", title: "Outer product: linear in x, conjugate-linear in y", src: "HW1 P7", star: true,
        goal: R`Show $f(x,y)=xy'$ is linear in $x$ and conjugate-linear in $y$.`,
        steps: [
          { line: R`$f(\alpha x+\beta z,y)=(\alpha x+\beta z)y'$`, why: "Definition of f" },
          { line: R`$=\alpha xy'+\beta zy'=\alpha f(x,y)+\beta f(z,y)$`, why: "Distribute, scalars pull out: linear in x" },
          { line: R`$f(x,\alpha y+\beta z)=x(\alpha y+\beta z)'$`, why: "Definition of f" },
          { line: R`$=x(\alpha^{*}y'+\beta^{*}z')$`, why: "Transpose of a sum, then (αA)′ = α*A′" },
          { line: R`$=\alpha^{*}xy'+\beta^{*}xz'=\alpha^{*}f(x,y)+\beta^{*}f(x,z)$`, why: "Distribute, scalars pull out: conjugate-linear in y" }
        ],
        whyPool: ["Socks and shoes", "Norm property ③", "(A′)′ = A", "AB = BA"],
        fillDistract: [R`$=x(\alpha y'+\beta z')$`, R`$=(\alpha^{*}x+\beta^{*}z)y'$`] },
      { id: "u1pr4", title: "Spotlight on a row, then an entry", src: "HW1 P1(c–d)",
        goal: R`Show $e_k'A=A_{k,:}$ and $e_i'Ae_j=A_{ij}$ using only $Ae_k=A_{:,k}$.`,
        steps: [
          { line: R`$e_k'A=\big((e_k'A)'\big)'$`, why: "(A′)′ = A" },
          { line: R`$=(A'e_k)'$`, why: "Socks and shoes: (e_k′A)′ = A′e_k" },
          { line: R`$=\big((A')_{:,k}\big)'=A_{k,:}$`, why: "Spotlight picks a column; column k of A′ is row k of A, flipped back" },
          { line: R`$e_i'Ae_j=e_i'A_{:,j}$`, why: "Spotlight picks column j" },
          { line: R`$=A_{ij}$`, why: "Spotlight e_i′ picks slot i" }
        ],
        whyPool: ["(αA)′ = α*A′", "Matrix multiplication distributes", "AB = BA", "Cauchy–Schwarz"],
        fillDistract: [R`$=A'e_k$`, R`$=(e_kA')'$`] },
      { id: "u1pr5", title: "Ae_k is column k", src: "HW1 P1(b) · 8/27 board",
        goal: R`Show $Ae_k=A_{:,k}$ with the linear-combination view of $Ax$.`,
        steps: [
          { line: R`$Ax=x_1A_{:,1}+\cdots+x_nA_{:,n}$ for any $x$`, why: "Ax is a combination of the columns of A" },
          { line: R`Take $x=e_k$: its entries are $0$ except a $1$ in slot $k$`, why: "Definition of the spotlight vector" },
          { line: R`$Ae_k=0\cdot A_{:,1}+\cdots+1\cdot A_{:,k}+\cdots+0\cdot A_{:,n}$`, why: "Plug the weights into the recipe" },

<script id="span-math">
/* Tiny TeX-subset → native MathML. No libraries, works offline. */
const SPANMath = (() => {
  const SYM = {
    alpha:"α",beta:"β",gamma:"γ",delta:"δ",epsilon:"ϵ",varepsilon:"ε",eta:"η",theta:"θ",lambda:"λ",mu:"μ",pi:"π",sigma:"σ",tau:"τ",phi:"φ",psi:"ψ",omega:"ω",
    Sigma:"Σ",Lambda:"Λ",Delta:"Δ",Omega:"Ω",Phi:"Φ",
    R:"ℝ",C:"ℂ",N:"ℕ"
  };
  const OPS = {
    in:"∈",notin:"∉",cdots:"⋯",ldots:"…",vdots:"⋮",ddots:"⋱",le:"≤",ge:"≥",leq:"≤",geq:"≥",ne:"≠",neq:"≠",perp:"⊥",dagger:"†",ast:"*",star:"∗",
    cdot:"·",times:"×",to:"→",Rightarrow:"⇒",iff:"⇔",approx:"≈",infty:"∞",forall:"∀",exists:"∃",langle:"⟨",rangle:"⟩",mid:"∣",circ:"∘",
    subseteq:"⊆",supseteq:"⊇",cup:"∪",cap:"∩",emptyset:"∅",sim:"∼",pm:"±",prime:"′",colon:":",vert:"|","|":"‖",
    "{":"{","}":"}",";":" ",",":" ",quad:" ",qquad:"  "
  };
  const WORDS = new Set(["op","text"]);
  const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

  function tokenize(s){
    const t=[]; let i=0;
    while(i<s.length){
      const c=s[i];
      if(c==="\\"){
        let j=i+1;
        if(/[A-Za-z]/.test(s[j]||"")){ while(j<s.length && /[A-Za-z]/.test(s[j])) j++; t.push({k:"cmd",v:s.slice(i+1,j)}); i=j; }
        else { t.push({k:"cmd",v:s[j]}); i=j+1; }
      } else if(/\s/.test(c)){ i++; }
      else if(/[0-9.]/.test(c)){ let j=i; while(j<s.length && /[0-9.]/.test(s[j])) j++; t.push({k:"num",v:s.slice(i,j)}); i=j; }
      else { t.push({k:"ch",v:c}); i++; }
    }
    return t;
  }

  function parse(src){
    const t=tokenize(src); let p=0;
    const peek=()=>t[p];
    function group(){ // read {…} or single atom
      const k=peek(); if(!k) return "";
      if(k.k==="ch"&&k.v==="{"){ p++; const r=seq(["}"]); p++; return wrap(r); }
      return atom();
    }
    function rawGroup(){ // {plain text}
      const k=peek(); if(!(k&&k.k==="ch"&&k.v==="{")) return "";
      p++; let depth=1, out="";
      while(p<t.length){ const x=t[p++]; if(x.k==="ch"&&x.v==="{") depth++; if(x.k==="ch"&&x.v==="}"){ depth--; if(!depth) break; }
        out += x.k==="cmd" ? (OPS[x.v]||SYM[x.v]||x.v) : x.v; }
      return out;
    }
    function wrap(arr){ return arr.length===1?arr[0]:`<mrow>${arr.join("")}</mrow>`; }
    function matrix(){
      // \mat{a & b \\ c & d}
      p++; // {
      const rows=[[[]]]; let depth=0;
      while(p<t.length){
        const k=peek();
        if(k.k==="ch"&&k.v==="}"&&depth===0){ p++; break; }
        if(k.k==="ch"&&k.v==="&"&&depth===0){ p++; rows[rows.length-1].push([]); continue; }
        if(k.k==="cmd"&&k.v==="\\"&&depth===0){ p++; rows.push([[]]); continue; }
        const r=rows[rows.length-1]; r[r.length-1].push(item());
      }
      const body=rows.filter(r=>r.some(c=>c.length)).map(r=>`<mtr>${r.map(c=>`<mtd>${wrap(c)||"<mrow></mrow>"}</mtd>`).join("")}</mtr>`).join("");
      return `<mrow class="bmat"><mtable class="bm" columnspacing="0.8em" rowspacing="0.3em">${body}</mtable></mrow>`;
    }
    function atom(){
      const k=t[p++]; if(!k) return "";
      if(k.k==="num") return `<mn>${k.v}</mn>`;
      if(k.k==="ch"){
        const c=k.v;
        if(/[A-Za-z]/.test(c)) return `<mi>${c}</mi>`;
        if(c==="'") return `<mo class="pr" lspace="0" rspace="0">′</mo>`;
        if(c==="-") return `<mo>−</mo>`;
        if(c==="*") return `<mo lspace="0" rspace="0">*</mo>`;
        if(c==="{"){ const r=seq(["}"]); p++; return wrap(r); }
        if("([".includes(c)) return `<mo stretchy="false">${c}</mo>`;
        if(")]".includes(c)) return `<mo stretchy="false">${c}</mo>`;
        if(c==="|") return `<mo stretchy="false">|</mo>`;
        if(c==="~") return `<mspace width="0.3em"></mspace>`;
        return `<mo>${esc(c)}</mo>`;
      }
      // command
      const v=k.v;
      if(v==="frac"){ const a=group(), b=group(); return `<mfrac>${a}${b}</mfrac>`; }
      if(v==="dfrac"){ const a=group(), b=group(); return `<mstyle displaystyle="true"><mfrac>${a}${b}</mfrac></mstyle>`; }
      if(v==="sqrt"){ return `<msqrt>${group()}</msqrt>`; }
      if(v==="mat"){ return matrix(); }
      if(v==="text"){ return `<mtext>${esc(rawGroup())}</mtext>`; }
      if(v==="op"){ return `<mi mathvariant="normal" class="op">${esc(rawGroup())}</mi><mo lspace="0" rspace="0.1em">⁡</mo>`; }
      if(v==="mathcal"){ return `<mi class="cal">${esc(rawGroup())}</mi>`; }
      if(v==="mathbf"){ return `<mi mathvariant="bold">${esc(rawGroup())}</mi>`; }
      if(v==="norm"){ return `<mrow><mo stretchy="false">‖</mo>${group()}<mo stretchy="false">‖</mo></mrow>`; }
      if(v==="abs"){ return `<mrow><mo stretchy="false">|</mo>${group()}<mo stretchy="false">|</mo></mrow>`; }
      if(v==="hl"||v==="blu"||v==="red"||v==="grn"||v==="acc"){ return `<mrow class="m-${v}">${group()}</mrow>`; }
      if(v==="underbrace"){ const a=group(); let lab=""; if(peek()&&peek().k==="ch"&&peek().v==="_"){ p++; lab=group(); } return `<munder><munder accentunder="true">${a}<mo stretchy="true">⏟</mo></munder>${lab?`<mstyle scriptlevel="1">${lab}</mstyle>`:"<mrow></mrow>"}</munder>`; }
      if(v==="argmin"||v==="argmax"||v==="min"||v==="max"){ return {lim:true, html:`<mo movablelimits="false" form="prefix">${v}</mo>`}; }
      if(v==="sum"){ return {lim:true, html:`<mo largeop="true" movablelimits="false">∑</mo>`}; }
      if(v==="textstyle"){ return ""; }
      if(v==="left"||v==="right"||v==="big"||v==="Big"){ const n=t[p++]; const ch=n?(n.k==="cmd"?(OPS[n.v]||n.v):n.v):""; if(ch==="."||!ch) return ""; return `<mo stretchy="true">${esc(ch)}</mo>`; }
      if(v===",") return `<mspace width="0.17em"></mspace>`;
      if(v===";") return `<mspace width="0.28em"></mspace>`;
      if(v===" ") return `<mspace width="0.25em"></mspace>`;
      if(v==="quad") return `<mspace width="1em"></mspace>`;
      if(v==="qquad") return `<mspace width="2em"></mspace>`;
      if(v==="\\") return "";
      if(SYM[v]) return /[A-Z]/.test(v[0])&&"RCN".includes(v)?`<mi mathvariant="normal">${SYM[v]}</mi>`:(/[A-Z]/.test(v[0])?`<mi mathvariant="normal">${SYM[v]}</mi>`:`<mi>${SYM[v]}</mi>`);
      if(OPS[v]){
        const o=OPS[v];
        if(v==="langle"||v==="rangle") return `<mo stretchy="false">${o}</mo>`;
        if(v==="|") return `<mo stretchy="false">‖</mo>`;
        if(v==="dagger"||v==="prime") return `<mo lspace="0" rspace="0">${o}</mo>`;
        if(v==="{"||v==="}") return `<mo stretchy="false">${o}</mo>`;
        return `<mo>${o}</mo>`;
      }
      return `<mi>${esc(v)}</mi>`;
    }
    function item(){
      let base=atom();
      let lim=false;
      if(base&&typeof base==="object"){ lim=true; base=base.html; }
      let sub=null, sup=null;
      while(peek()&&peek().k==="ch"&&(peek().v==="_"||peek().v==="^")){
        const w=t[p++].v; const g=group();
        if(w==="_") sub=g; else sup=g;
      }
      if(lim){
        if(sub&&sup) return `<munderover>${base}${sub}${sup}</munderover>`;
        if(sub) return `<munder>${base}${sub}</munder>`;
        if(sup) return `<mover>${base}${sup}</mover>`;
        return base;
      }
      if(sub&&sup) return `<msubsup>${base||"<mrow></mrow>"}${sub}${sup}</msubsup>`;
      if(sub) return `<msub>${base||"<mrow></mrow>"}${sub}</msub>`;
      if(sup) return `<msup>${base||"<mrow></mrow>"}${sup}</msup>`;
      return base;
    }
    function seq(stops){
      const out=[];

<script id="span-app">

const dayStr = (d = new Date()) => { const z = new Date(d.getTime() - d.getTimezoneOffset() * 60000); return z.toISOString().slice(0, 10); };

    (D.proofs[u.id] || []).forEach(x => ["order", "why", "fill"].forEach(m => ITEMS[x.id + ":" + m] = { key: x.id + ":" + m, kind: "proof", mode: m, unit: u.id, ref: x }));

}
indexContent();
const stonesOf = uid => (D.stones[uid] || []);
const stoneById = id => { for (const u of UNITS) { const s = stonesOf(u.id).find(x => x.id === id); if (s) return s; } return null; };

const $ = (sel, el = document) => el.querySelector(sel);

/* ── MCQ component ── */
function mcq(el, item, onDone, opts = {}) {
  const isTF = item.type === "tf";
  const options = isTF ? ["True", "False"] : item.opts;
  const answer = isTF ? (item.a ? 0 : 1) : item.a;
  const order = isTF ? [0, 1] : shuffle(options.map((_, i) => i));
  const codeCls = item.codeOpts ? "code" : "";
  el.innerHTML = `<div class="q">${item.code ? `<pre class="jl">${hlJulia(item.code)}</pre>` : ""}<p class="qtext">${rich(item.q)}</p>
    <div class="opts">${order.map((oi, j) => `<button class="opt ${codeCls}" data-j="${j}"><span class="k">${j + 1}</span><span class="ot">${item.codeOpts ? esc(options[oi]) : rich(options[oi])}</span></button>`).join("")}</div><div class="fb"></div></div>`;
  let done = false;
  const pick = j => {
    if (done || j >= order.length) return; done = true;
    const chosen = order[j], ok = chosen === answer;
    el.querySelectorAll(".opt").forEach((b, jj) => { b.disabled = true; const oi = order[jj]; if (oi === answer) b.classList.add("right"); else if (jj === j) b.classList.add("wrong"); else b.classList.add("dim"); });
    if (!opts.silent) el.querySelector(".fb").innerHTML = `<div class="feedback ${ok ? "ok" : "no"}"><b>${ok ? pickCheer() : "Not quite."}</b><span>${rich(item.why || "")}</span></div>`;
    if (ok && !opts.silent) { const r = el.querySelector(".opt.right"); r.classList.add("burst"); }
    onDone && onDone(ok, chosen, options);
  };
  el.querySelectorAll(".opt").forEach(b => b.onclick = () => pick(+b.dataset.j));
  return { pick, get done() { return done; } };
}
const CHEERS = ["That's it.", "Solid.", "Yes, exactly.", "Nailed it.", "Right on.", "Clean."];
const pickCheer = () => CHEERS[Math.floor(Math.random() * CHEERS.length)];
function hlJulia(code) {
  return esc(code).split("\n").map(line => {
    const ci = line.indexOf("#"); let body = ci >= 0 ? line.slice(0, ci) : line, cm = ci >= 0 ? line.slice(ci) : "";
    body = body.replace(/\b(using|function|end|for|in|return|im)\b/g, '<span class="kw">$1</span>').replace(/(?<![A-Za-z_])(\d+(?:\.\d+)?)/g, '<span class="nu">$1</span>');
    return body + (cm ? `<span class="cm">${cm}</span>` : "");
  }).join("\n");
}

function examMount(root) {
  const it = ITEMS[EXAM.keys[EXAM.i]]; const body = $("#body");
  const tick = () => { const ms = Math.max(0, EXAM.end - Date.now()); const m = Math.floor(ms / 60000), s = Math.floor(ms / 1000) % 60; const el = $("#exTimer"); if (el) el.textContent = `${m}:${String(s).padStart(2, "0")}`; if (ms <= 0) finishExam(); };
  tick(); const id = setInterval(tick, 500); cleanup.push(() => clearInterval(id));
  let quitArm = false; $("#exQuit").onclick = () => { if (quitArm) { EXAM = null; go("practice", { unit: "u1" }); } else { quitArm = true; $("#quitMsg").hidden = false; } };

  let h;
  if (it.kind === "proof") {
    // fill-the-gap in exam style

function mountWidgets(root) { root.querySelectorAll("[data-widget]").forEach(el => { const f = WIDGETS[el.dataset.widget]; if (f) f(el); }); }
const W = 300, RANGE = 4.5, sc = v => (v / RANGE) * (W / 2);

const fmt = v => { const r = Math.round(v * 10) / 10; return (Object.is(r, -0) ? 0 : r).toString().replace("-", "−"); };
const fmtT = v => { const r = Math.round(v * 10) / 10; return String(Object.is(r, -0) ? 0 : r); };
function arrow(a, b, color, w = 3.5, id) { const [x1, y1] = toSvg(a), [x2, y2] = toSvg(b); return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="${w}" stroke-linecap="round" marker-end="url(#ah-${id})"/>`; }
function markers(list) { return `<defs>${list.map(([id, c]) => `<marker id="ah-${id}" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="${c}"/></marker>`).join("")}</defs>`; }
function gridBg() { let g = ""; for (let i = -4; i <= 4; i++) { const [x] = toSvg([i, 0]), [, y] = toSvg([0, i]); g += `<line class="gridline" x1="${x}" y1="0" x2="${x}" y2="${W}"/><line class="gridline" x1="0" y1="${y}" x2="${W}" y2="${y}"/>`; } return g + `<line class="axis" x1="0" y1="${W / 2}" x2="${W}" y2="${W / 2}"/><line class="axis" x1="${W / 2}" y1="0" x2="${W / 2}" y2="${W}"/>`; }
function drag(svg, getHandles, onMove) {
  let active = null;
  svg.addEventListener("pointerdown", e => { const pt = fromSvg(svg, e); let best = null, bd = 0.9; getHandles().forEach((h, i) => { const d = Math.hypot(h[0] - pt[0], h[1] - pt[1]); if (d < bd) { bd = d; best = i; } }); if (best != null) { active = best; svg.setPointerCapture(e.pointerId); e.preventDefault(); } });

  const end = () => active = null; svg.addEventListener("pointerup", end); svg.addEventListener("pointercancel", end);
}
const CO = { a: "#FF8A65", b: "#7FB2FF", r: "#F4F2FF", g: "#6EE7A8" };

const WIDGETS = {
  columns(el) {
    let a1 = [2, 1], a2 = [-1, 1.5], x = [1, 1];

      el.querySelector("#wout").innerHTML = tex(`A=\\mat{${fmtT(a1[0])}&${fmtT(a2[0])}\\\\${fmtT(a1[1])}&${fmtT(a2[1])}}`, true) + tex(`Ax=\\hl{${fmtT(x[0])}}\\mat{${fmtT(a1[0])}\\\\${fmtT(a1[1])}}+\\blu{${fmtT(x[1])}}\\mat{${fmtT(a2[0])}\\\\${fmtT(a2[1])}}=\\mat{${fmtT(r[0])}\\\\${fmtT(r[1])}}`, true);

  angle(el) {
    let x = [3, 1], y = [1, 2.5];
    el.innerHTML = `<div class="widget"><p class="wcap">Drag x and y. The dashed shadow is x projected onto y's direction. Make the match score hit 0.</p><svg viewBox="0 0 ${W} ${W}" role="img" aria-label="Angle between two vectors"></svg><div class="wout" id="wout"></div><div id="cs"></div></div>`;
    const svg = el.querySelector("svg");
    const draw = () => {
      const ip = x[0] * y[0] + x[1] * y[1], nx = Math.hypot(...x), ny = Math.hypot(...y);
      const c = nx && ny ? ip / (nx * ny) : 0, th = Math.acos(Math.max(-1, Math.min(1, c))) * 180 / Math.PI;
      const pr = ny ? [ip / (ny * ny) * y[0], ip / (ny * ny) * y[1]] : [0, 0];
      const ax = Math.atan2(x[1], x[0]), ay = Math.atan2(y[1], y[0]); let d = ay - ax; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI;
      const rr = 0.9, pts = []; for (let k = 0; k <= 20; k++) { const t = ax + d * k / 20; pts.push(toSvg([rr * Math.cos(t), rr * Math.sin(t)]).join(",")); }
      const perp = Math.abs(ip) < 0.05;
      svg.innerHTML = markers([["a", CO.a], ["b", CO.b]]) + gridBg() +
        `<polyline points="${pts.join(" ")}" fill="none" stroke="${perp ? CO.g : "#FFC857"}" stroke-width="3"/>` +
        `<line x1="${toSvg(x)[0]}" y1="${toSvg(x)[1]}" x2="${toSvg(pr)[0]}" y2="${toSvg(pr)[1]}" stroke="rgba(244,242,255,.45)" stroke-width="2" stroke-dasharray="5 5"/>` +
        `<line x1="${toSvg([0, 0])[0]}" y1="${toSvg([0, 0])[1]}" x2="${toSvg(pr)[0]}" y2="${toSvg(pr)[1]}" stroke="#FFC857" stroke-width="6" stroke-linecap="round" opacity=".6"/>` +
        arrow([0, 0], x, CO.a, 4, "a") + arrow([0, 0], y, CO.b, 4, "b") +
        `<circle class="handle" cx="${toSvg(x)[0]}" cy="${toSvg(x)[1]}" r="11" fill="${CO.a}" stroke="#0D1022" stroke-width="3"/><circle class="handle" cx="${toSvg(y)[0]}" cy="${toSvg(y)[1]}" r="11" fill="${CO.b}" stroke="#0D1022" stroke-width="3"/>` +
        `<text x="${toSvg(x)[0] + 12}" y="${toSvg(x)[1] - 8}" fill="${CO.a}">x</text><text x="${toSvg(y)[0] + 12}" y="${toSvg(y)[1] - 8}" fill="${CO.b}">y</text>`;
      el.querySelector("#wout").innerHTML = tex(`y'x=${fmtT(ip)},\\quad \\norm{x}\\norm{y}=${fmtT(nx * ny)},\\quad \\cos\\theta=${(Math.round(c * 100) / 100)}`, true) + `<p class="small">θ ≈ ${Math.round(th)}° ${perp ? `<span class="badge-perp">· perpendicular: x ⊥ y</span>` : ""}</p>`;
      const frac = nx * ny ? Math.abs(ip) / (nx * ny) : 0;
      el.querySelector("#cs").innerHTML = `<div class="small">Cauchy–Schwarz: |y′x| can never pass ‖x‖‖y‖</div><div class="progress" style="height:12px"><i style="width:${frac * 100}%;background:${frac > .99 ? CO.g : "#FFC857"}"></i></div>`;
    };
    drag(svg, () => [x, y], (i, p) => { if (i === 0) x = p; else y = p; draw(); });
    draw();
  },
  outer(el) {
    let u = [1, 2, -1], v = [3, 1, 0], u2 = [0, 1, 1], v2 = [1, 0, 2], two = false;
    el.innerHTML = `<div class="widget"><p class="wcap">Each column of uv′ is a copy of u, scaled by one entry of v. Add a second copy machine to raise the rank.</p><div id="ctrl"></div><div class="cells" id="cells"></div><div class="wout" id="wout"></div><button class="btn small ghost" id="tog">Add a second piece</button></div>`;
    const stepper = (arr, i, name) => `<span class="stepper"><button data-a="${name}" data-i="${i}" data-d="-1" aria-label="${name}${i + 1} down">−</button><b>${arr[i]}</b><button data-a="${name}" data-i="${i}" data-d="1" aria-label="${name}${i + 1} up">+</button></span>`;
    const vecCol = (label, arr, name) => `<div class="vc"><b class="lab">${label}</b>${arr.map((_, i) => stepper(arr, i, name)).join("")}</div>`;
    const pair = (l1, a1_, n1, l2, a2_, n2) => `<div class="vecs">${vecCol(l1, a1_, n1)}${vecCol(l2, a2_, n2)}</div>`;
    const rank = M => { const A = M.map(r => r.slice()); let rk = 0; const rows = 3, cols = 3; for (let c = 0; c < cols && rk < rows; c++) { let piv = -1, best = 1e-9; for (let r = rk; r < rows; r++) if (Math.abs(A[r][c]) > best) { best = Math.abs(A[r][c]); piv = r; } if (piv < 0) continue; [A[rk], A[piv]] = [A[piv], A[rk]]; for (let r = 0; r < rows; r++) if (r !== rk) { const f = A[r][c] / A[rk][c]; for (let k = 0; k < cols; k++) A[r][k] -= f * A[rk][k]; } rk++; } return rk; };
    const draw = () => {
      const M = [0, 1, 2].map(i => [0, 1, 2].map(j => u[i] * v[j] + (two ? u2[i] * v2[j] : 0)));
      const mx = Math.max(1, ...M.flat().map(Math.abs));
      el.querySelector("#ctrl").innerHTML = pair("u", u, "u", "v", v, "v") + (two ? `<div style="height:10px"></div>` + pair("u₂", u2, "u2", "v₂", v2, "v2") : "");
      el.querySelector("#cells").style.gridTemplateColumns = "repeat(3,52px)";
      el.querySelector("#cells").innerHTML = M.flat().map(val => `<div class="cell" style="background:${val > 0 ? `rgba(255,138,101,${0.15 + 0.6 * val / mx})` : val < 0 ? `rgba(127,178,255,${0.15 + 0.6 * -val / mx})` : "rgba(255,255,255,.05)"}">${String(val).replace("-", "−")}</div>`).join("");
      const rk = rank(M);
      el.querySelector("#wout").innerHTML = (two ? tex(`uv'+u_2v_2'`, true) : tex(`uv'=\\mat{${v[0]}u & ${v[1]}u & ${v[2]}u}`, true)) + `<p class="small">rank = <b>${rk}</b>${two ? (rk < 2 ? " · the two pieces point the same way, or one is zero" : " · two independent copy machines") : (rk === 0 ? " · u or v is all zeros" : " · one direction only")}</p>`;
      el.querySelector("#tog").textContent = two ? "Back to one piece" : "Add a second piece";
      el.querySelectorAll("[data-a]").forEach(b => b.onclick = () => { const arr = { u, v, u2, v2 }[b.dataset.a]; const i = +b.dataset.i; arr[i] = Math.max(-3, Math.min(3, arr[i] + +b.dataset.d)); draw(); });
    };
    el.querySelector("#tog").onclick = () => { two = !two; draw(); };
    draw();
  },
  spotlight(el) {
    const A = [[1, 2, 3], [4, 5, 6], [7, 8, 9]]; let mode = "col", k = 1, i = 0;
    el.innerHTML = `<div class="widget"><div class="seg" role="group" aria-label="Spotlight mode"><button data-m="col">A eₖ</button><button data-m="row">eₖ′A</button><button data-m="ent">eᵢ′A eⱼ</button></div>
      <div class="row" style="justify-content:center" id="ks"></div><div class="cells" id="cells" style="grid-template-columns:repeat(3,52px)"></div><div class="wout" id="wout"></div></div>`;
    const draw = () => {
      el.querySelectorAll("[data-m]").forEach(b => b.setAttribute("aria-pressed", b.dataset.m === mode));
      const pick = (lab, cur, set) => `<span class="small" style="font-weight:800">${lab}</span>${[0, 1, 2].map(n => `<button class="btn small ${cur === n ? "primary" : "ghost"}" data-${set}="${n}" style="min-width:48px">${n + 1}</button>`).join("")}`;
      el.querySelector("#ks").innerHTML = mode === "ent" ? pick("i", i, "i") + pick("j", k, "k") : pick("k", k, "k");
      el.querySelector("#cells").innerHTML = A.flatMap((row, r) => row.map((val, c) => { const on = mode === "col" ? c === k : mode === "row" ? r === k : (r === i && c === k); return `<div class="cell" style="background:${on ? "var(--unit)" : "rgba(255,255,255,.05)"};color:${on ? "var(--unit-ink)" : "var(--muted)"}">${val}</div>`; })).join("");
      const e = n => `e_{${n + 1}}`;
      el.querySelector("#wout").innerHTML = mode === "col" ? tex(`A${e(k)}=A_{:,${k + 1}}=\\mat{${A[0][k]}\\\\${A[1][k]}\\\\${A[2][k]}}`, true)
        : mode === "row" ? tex(`${e(k)}'A=A_{${k + 1},:}=\\mat{${A[k].join("&")}}`, true) : tex(`${e(i)}'A${e(k)}=A_{${i + 1}${k + 1}}=${A[i][k]}`, true);
      el.querySelectorAll("[data-k]").forEach(b => b.onclick = () => { k = +b.dataset.k; draw(); });
      el.querySelectorAll("[data-i]").forEach(b => b.onclick = () => { i = +b.dataset.i; draw(); });
    };
    el.querySelectorAll("[data-m]").forEach(b => b.onclick = () => { mode = b.dataset.m; draw(); });
    draw();
  }
};

/* ───────── boot ───────── */
const start = (location.hash || "").slice(1);
if (["home", "learn", "practice", "vault", "more"].includes(start)) nav = { tab: start, view: start, p: {} };
render();
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (["home", "learn", "practice", "vault", "more"].includes(h) && h !== nav.tab) go(h, {}, h); });
if ("serviceWorker" in navigator && location.protocol === "https:" && !/claudeusercontent|claude\.ai/.test(location.hostname)) {
  try { navigator.serviceWorker.register("sw.js").catch(() => {}); } catch (e) {}
}
})();

</script>
