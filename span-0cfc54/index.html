(function(){ const R = String.raw;

/* Unit 10: Affine approximation & PCA.
   Sources: 10/13 board, 10/15 board (first half), HW4 P4 (prep notes + exam bank 10, Likely 19),
   HW5 P3 (oct20 notes + exam bank 22-24, Likely 21), MNIST PCA demo (oct29 notes). */

window.SPAN_ADD("u10", {
  blurb: "Shift the subspace to the average and you have the affine fit; read the same answer as the directions where the data spread out most and you have PCA.",
  sources: "10/13 + 10/15 boards · HW4 P4 (prep notes) · HW5 P3 (Oct 20 notes) · Exam 1 bank (10, 22–24, Likely 18, 19, 21) · 10/29 MNIST demo (notes)",

  stones: [
    { id: "u10s1", title: "Subspace approx as an auto-encoder", src: "10/13 board",
      nick: "Squeeze and rebuild",
      intuition: R`Recap first: the best $r$-dim subspace for data $X=\mat{x_1&\cdots&x_n}$ is $U=P_{:,1:r}$ where $X=P\Sigma Q'$. His aside ①: read the fit as an **auto-encoder**. $U'$ **encodes** $x$ into $r$ numbers, the latent representation $\tilde x=U'x$ that "captures the action". $U$ **decodes** back to $UU'x$. Swap in nonlinear encoders and decoders (learned neural nets) and the same picture fits a circle or a spiral, which are 1-dim but curved. Aside ②: the solutions are **nested**: $P_{:,1}⊂ P_{:,1:2}⊂ P_{:,1:3}\cdots$.`,
      visual: "project",
      math: R`$$x\ \ \to\ \ \underbrace{\tilde x=U'x}_{\text{latent, }r\text{ numbers}}\ \ \to\ \ UU'x,\qquad \text{err}=x-UU'x$$`,
      mathNote: R`Nested: $r=1$ uses $\mat{p_1}$, $r=2$ uses $\mat{p_1&p_2}$, … "useful for dim reduction (to save computation, or visualization)." Nonlinear version: err = x − decoder_θ(encoder_ψ(x)), optimize θ, ψ.`,
      example: { q: R`$U=\frac{1}{\sqrt2}\mat{1\\1}$, $x=\mat{3\\1}$. Encode, decode, and find the error.`,
        steps: [R`Encode: $\tilde x=U'x=\frac{1}{\sqrt2}(3+1)=2\sqrt2$.`, R`Decode: $U\tilde x=\frac{1}{\sqrt2}\mat{1\\1}2\sqrt2=\mat{2\\2}$.`, R`Error: $x-UU'x=\mat{1\\-1}$, which is $\perp U$.`],
        answer: R`$\tilde x=2\sqrt2$, $UU'x=\mat{2\\2}$, err $=\mat{1\\-1}$` },
      check: { q: R`In the auto-encoder picture, which matrix is the **encoder**?`, opts: [R`$U'$`, R`$U$`, R`$UU'$`, R`$I-UU'$`], a: 0,
        why: R`$U'$ squeezes $x\in\R^d$ to $r$ coordinates; $U$ rebuilds.` } },

    { id: "u10s2", title: "The same U is an eigenvector matrix", src: "10/13 board · HW4 P4",
      nick: "Sandwich the SVD",
      intuition: R`Multiply $X$ by its own transpose and the inner $Q'Q$ collapses to $I$. What is left is $P$, a diagonal, and $P'$: that **is** the eigen-decomposition of $XX'$. So the columns of $P$ (our subspace basis) are eigenvectors of $XX'$, with eigenvalues $\sigma_i^2$ then zeros. HW4 P4 is the same move on $AA'$ and $A'A$.`,
      visual: "svdmap",
      math: R`$$XX'=P\Sigma\underbrace{Q'Q}_{I}\Sigma'P'=P\underbrace{\Sigma\Sigma'}_{\Lambda}P',\qquad (XX')P=P\Lambda$$`,
      mathNote: R`His label: "matrix form of eigval-eigvec equation." $\Lambda=\Sigma\Sigma'=\op{diag}(\sigma_1^2,\ldots,\sigma_r^2,0,\ldots,0)\in\R^{d\times d}$. Mirror: $X'X=Q(\Sigma'\Sigma)Q'$, an $n\times n$ matrix with the same nonzero eigenvalues.`,
      example: { q: R`$A\in\R^{4\times5}$ has rank 2 with $\sigma_1\ge\sigma_2>0$. Nonzero eigenvalues of $AA'$? How many zeros for $AA'$ and for $A'A$?`,
        steps: [R`$AA'=U(\Sigma\Sigma')U'$, so nonzero eigenvalues are $\sigma_1^2,\sigma_2^2$.`, R`$AA'$ is $4\times4$: $4-2=2$ zeros.`, R`$A'A=V(\Sigma'\Sigma)V'$ is $5\times5$: $5-2=3$ zeros.`],
        answer: R`$\sigma_1^2,\sigma_2^2$; 2 zeros ($AA'$), 3 zeros ($A'A$)` },
      check: { q: R`$X=P\Sigma Q'$. The eigenvalues of $XX'$ are…`, opts: [R`$\sigma_i^2$, then zeros`, R`$\sigma_i$, then zeros`, R`$1/\sigma_i^2$, then zeros`, R`all equal to 1`], a: 0,
        why: R`$\Lambda=\Sigma\Sigma'$ squares each singular value.` } },

    { id: "u10s3", title: "What is (1/n)XX′?", src: "10/13 board",
      nick: "Average of copy machines",
      intuition: R`Divide by $n$ and nothing about the eigenvectors changes; the eigenvalues just shrink to $\lambda_i=\sigma_i^2/n$. Entry $(i,j)$ of $\frac1nXX'$ averages $(x_l)_i(x_l)_j$ over the data, so it **estimates** $E[x_ix_j]$, the "correlation between $i$th coord & $j$th coord". The whole matrix estimates $E[xx']$.`,
      weird: R`**Weird rule:** his board says eigvals in "non-decreasing order" but writes $\lambda_1\ge\cdots\ge\lambda_r>0$. The inequalities are right: largest first, like singular values.`,
      math: R`$$\frac1nXX'=V\Lambda V',\quad U=V_{:,1:r},\quad \lambda_i=\frac{\sigma_i^2}{n},\qquad \frac1n(XX')_{ij}=\frac1n\sum_{l=1}^{n}(x_l)_i(x_l)_j$$`,
      mathNote: R`Also $\frac1nXX'=\frac1n\sum_l x_l x_l'$: an average of copy machines. Here $V=P$ (same eigenvectors).`,
      example: { q: R`$X=\mat{3&0&0\\0&1&0}$ ($n=3$). Find $\frac1nXX'$ and its eigenvalues.`,
        steps: [R`$XX'=\op{diag}(9,1)$ (rows are orthogonal).`, R`Divide by $n=3$.`, R`Check: $\sigma_1=3,\sigma_2=1$ so $\sigma_i^2/n=3,\ 1/3$.`],
        answer: R`$\frac1nXX'=\op{diag}(3,\frac13)$, $\lambda=3,\frac13$` },
      check: { q: R`$\sigma_1=6$ and $n=4$. What is $\lambda_1$ of $\frac1nXX'$?`, opts: ["9", "36", "1.5", "6"], a: 0, why: R`$\lambda_1=\sigma_1^2/n=36/4=9$.` } },

    { id: "u10s4", title: "What about centering?", src: "10/13 board", star: true,
      nick: "Let the line float",
      intuition: R`A subspace must pass through 0. Real clouds often don't. So let the subspace **float**: fit $\mathcal{R}(U)+b$, an affine space, and optimize $U$ **and** the offset $b$. For fixed $U,b$ the closest point $Uz+b$ is plain least squares with "y" $=x_i-b$, "A" $=U$, so $z=U^{\dagger}(x_i-b)=U'(x_i-b)$.`,
      visual: "fit",
      math: R`$$\argmin_{U'U=I_r,\ b\in\R^d}\ \frac1n\sum_{i=1}^{n}\op{dist}(x_i,\mathcal{R}(U)+b)^2,\qquad \op{dist}^2=\norm{(I-UU')(x_i-b)}^2$$`,
      mathNote: R`Complete $U$ to an orthogonal $\mat{U&U^{\perp}}$: $I=UU'+U^{\perp}U^{\perp\prime}$, so $I-UU'=U^{\perp}U^{\perp\prime}$ = projection onto the "remaining axes".`,
      example: { q: R`$U=e_1$ in $\R^2$, $b=\mat{0\\1}$, $x=\mat{4\\3}$. Find $z$ and $\op{dist}(x,\mathcal{R}(U)+b)^2$.`,
        steps: [R`$x-b=\mat{4\\2}$, $z=U'(x-b)=4$.`, R`Closest point $Uz+b=\mat{4\\1}$.`, R`$(I-UU')(x-b)=\mat{0\\2}$, squared length 4.`],
        answer: R`$z=4$, $\op{dist}^2=4$` },
      check: { q: R`With $U'U=I$, $I-UU'$ equals…`, opts: [R`$U^{\perp}U^{\perp\prime}$`, R`$U'U$`, R`$0$`, R`$U^{\perp\prime}U^{\perp}$`], a: 0,
        why: R`$\mat{U&U^{\perp}}$ orthogonal ⇒ $UU'+U^{\perp}U^{\perp\prime}=I$.` } },

    { id: "u10s5", title: "Optimal offset: the average", src: "10/13 board", star: true,
      nick: "Center of mass",
      intuition: R`Fix $U$ and solve for $b$. Expand the trace, drop what doesn't depend on $b$, complete the square: you get a least-squares problem in $b$ whose "y" is $\frac1nU^{\perp\prime}X1_n$. And $\frac1nX1_n$ is the **average** $\bar x$. Solutions: $b^*=(I-UU')\bar x+\mathcal{R}(U)$, "optimal offsets for the affine space!" Every one of them sits on the line through $\bar x$.`,
      math: R`$$\argmin_{b}\ \Big\|\underbrace{\frac1nU^{\perp\prime}X1_n}_{\text{"y"}}-\underbrace{U^{\perp\prime}}_{\text{"A"}}\underbrace{b}_{\text{"x"}}\Big\|^2\ \Rightarrow\ \grn{b^*=(I-UU')\bar x+\mathcal{R}(U)},\qquad \bar x=\frac1nX1_n=\frac1n\sum_i x_i$$`,
      mathNote: R`The free part is $\mathcal{N}(U^{\perp\prime})=\mathcal{R}(U)$. Since $\bar x=(I-UU')\bar x+UU'\bar x$, the choice $b=\bar x$ is always one of them.`,
      example: { q: R`$U=e_1$ in $\R^2$ and $\bar x=\mat{1.5\\3.5}$. Which offsets are optimal?`,
        steps: [R`$(I-UU')\bar x=\mat{0\\3.5}$.`, R`Add anything in $\mathcal{R}(e_1)$: $\mat{t\\0}$.`],
        answer: R`$b^*=\mat{t\\3.5}$ for any $t$, e.g. $b=\bar x$ or $b=\mat{0\\3.5}$` },
      check: { q: R`Why is $b^*$ not unique?`, opts: [R`Sliding $b$ along $\mathcal{R}(U)$ doesn't move the affine space`, R`Because the average $\bar x$ itself is not unique`, R`Because $U^{\perp}$ is not a square matrix here`, R`Because the fitting error is always zero anyway`], a: 0,
        why: R`$\mathcal{R}(U)+b=\mathcal{R}(U)+b+Uw$: same set of points.` } },

    { id: "u10s6", title: "Just subspace approx of centered data", src: "10/15 board",
      nick: "Center, then fit",
      intuition: R`Plug $b^*$ back in. Projection² = projection ("idempotent"), so $(I-UU')^2\bar x$ collapses and the error becomes $\norm{(I-UU')(x_i-\bar x)}^2$. The **centered data** $\tilde x_i=x_i-\bar x$ ("displacement from avg") is all that matters. So the affine problem is "just subspace approx of centered data!"`,
      weird: R`**Weird rule:** $(I-UU')^2=I-UU'$ even though $I-UU'\ne I$. Projecting twice lands you where projecting once did.`,
      math: R`$$\tilde X=\mat{\tilde x_1&\cdots&\tilde x_n}=X-\bar x1_n'=X\underbrace{\big(I-\frac1n1_n1_n'\big)}_{\text{centering operator}},\qquad \blu{U^*=P_{:,1:r}}\ \text{where}\ \tilde X=P\Sigma Q'$$`,
      mathNote: R`Boxed summary: $U^*=P_{:,1:r}$ of $\tilde X$, and "just choose $b^*=\bar x$" $=(I-U^*U^{*\prime})\bar x+U^*U^{*\prime}\bar x$.`,
      example: { q: R`$X=\mat{1&3\\2&6}$. Center it with the centering operator.`,
        steps: [R`$I-\frac12 1_21_2'=\mat{0.5&-0.5\\-0.5&0.5}$.`, R`$X(I-\frac12 1_21_2')=\mat{-1&1\\-2&2}$.`, R`Check: $\bar x=\mat{2\\4}$, $x_1-\bar x=\mat{-1\\-2}$ ✓.`],
        answer: R`$\tilde X=\mat{-1&1\\-2&2}$` },
      check: { q: R`For the affine fit, take the SVD of…`, opts: [R`$X(I-\frac1n1_n1_n')$`, R`$X$ itself, uncentered`, R`$X-1_n1_n'$ (minus ones)`, R`$\frac1nX1_n1_n'$`], a: 0,
        why: "Centered data, then the usual first r left singular vectors." } },

    { id: "u10s7", title: "Covariance and variance in a direction", src: "10/15 board", star: true,
      nick: "Spread meter",
      intuition: R`Recall $U^*=P_{:,1:r}$ is also $V_{:,1:r}$ for $\frac1n\tilde X\tilde X'=V\Lambda V'$. Entry $(i,j)$ of that matrix is the covariance of the $i$th & $j$th variables: it is the **covariance matrix** $C$. Rewrite the error with trace tricks: $\op{tr}C-\op{tr}(U'CU)$. Minimizing error = maximizing $\op{tr}(U'CU)=u_1'Cu_1+\cdots+u_r'Cu_r$. And $u'Cu$ is the **variance of** $u'x_1,\ldots,u'x_n$: how spread out the data are along $u$.`,
      math: R`$$C=\frac1n\tilde X\tilde X'=\frac1n\sum_{i}(x_i-\bar x)(x_i-\bar x)',\qquad \op{tr}\big((I-UU')C(I-UU')\big)=\op{tr}C-\op{tr}(U'CU)$$`,
      mathNote: R`$u'Cu=\frac1n\sum_i(u'x_i-u'\bar x)^2$ and $u'\bar x$ is the average of the $u'x_i$. "$u'x_i$ = how far along $u$ is $x_i$?"`,
      example: { q: R`Data $(0,3),(1,2),(2,5),(3,4)$. Find $\bar x$, $C$, and the variance along $u=\frac1{\sqrt2}\mat{1\\1}$.`,
        steps: [R`$\bar x=\mat{1.5\\3.5}$; centered columns $\mat{-1.5\\-0.5},\mat{-0.5\\-1.5},\mat{0.5\\1.5},\mat{1.5\\0.5}$.`, R`$C=\frac14\tilde X\tilde X'=\mat{1.25&0.75\\0.75&1.25}$.`, R`$u'Cu=\frac12(1.25+0.75+0.75+1.25)=2$. (Check: $u'\tilde x_i=∓\sqrt2$, squares average to 2.)`],
        answer: R`$C=\mat{1.25&0.75\\0.75&1.25}$, variance along $u$ = 2` },
      check: { q: R`Same $C$. What is the variance along $e_1$?`, opts: ["1.25", "0.75", "2", "0.5"], a: 0, why: R`$e_1'Ce_1=C_{11}=1.25$.` } },

    { id: "u10s8", title: "PCA: directions of max spread", src: "10/15 board · 10/20 summary board",
      nick: "Most spread out first",
      intuition: R`Write $u$ in the eigenbasis: $\tilde u=V'u$. Then $u'Cu=\lambda_1\tilde u_1^2+\cdots+\lambda_d\tilde u_d^2$ with the $\tilde u_j^2$ adding up to 1. Put all the weight on the biggest $\lambda$: $\tilde u=e_1$, so $u=v_1$, variance $\lambda_1$. Next best direction, forced $\perp v_1$: $v_2$, variance $\lambda_2$. That greedy list is **principal components analysis**. "Answer: same as affine approx."`,
      math: R`$$u_1=\argmax_{\norm{w}=1}w'Cw,\qquad u_2=\argmax_{\norm{w}=1,\ w\perp u_1}w'Cw,\qquad u_3=\argmax_{\norm{w}=1,\ w\perp u_1,u_2}w'Cw,\ \ldots$$`,
      mathNote: R`His words: "find direction w/ max var", "find direction that captures as much of the variance as possible", "find the next best dir".`,
      example: { q: R`Same $C=\mat{1.25&0.75\\0.75&1.25}$. Find $u_1,u_2$ and their variances.`,
        steps: [R`$C\mat{1\\1}=2\mat{1\\1}$ and $C\mat{1\\-1}=0.5\mat{1\\-1}$.`, R`Biggest eigenvalue first.`],
        answer: R`$u_1=\frac1{\sqrt2}\mat{1\\1}$ (var 2), $u_2=\frac1{\sqrt2}\mat{1\\-1}$ (var 0.5)` },
      check: { q: R`$C$ has eigenvalues 5, 2, 1. What variance does the second principal direction capture?`, opts: ["2", "5", "1", "7"], a: 0, why: R`$u_2=v_2$, variance $\lambda_2=2$.` } },

    { id: "u10s9", title: "HW5 P3: three ways to fit a line", src: "HW5 P3 (Oct 20 notes) · exam bank 24, Likely 21", star: true,
      nick: "Origin, average, or vertical",
      intuition: R`Same points, three answers. **Subspace** fit is forced through 0. **Affine** fit = subspace fit of the centered data, measured with **perpendicular** errors, so $x_1$ and $x_2$ are treated alike. **LS line fit** $x_2=a_1+a_2x_1$ predicts $x_2$ from $x_1$ ("supervised"): **vertical** errors, $\hat a=\mat{1_n&x}^{\dagger}y$.`,
      visual: "fit",
      math: R`$$\text{subspace: }\mathcal{R}(U)∋0,\qquad \text{affine: }\mathcal{R}(U)+\bar x,\qquad \text{LS: }\argmin_a\norm{y-\mat{1_n&x}a}^2$$`,
      mathNote: R`A high-degree polynomial can hit every point but go "crazy outside the points": that is where regularization comes in.`,
      example: { q: R`Points $(0,3),(1,2),(2,5),(3,4)$. Give the affine line and the LS line.`,
        steps: [R`Affine: through $\bar x=(1.5,3.5)$ along $u_1∝\mat{1\\1}$: $x_2=x_1+2$.`, R`LS: slope $=\frac{\sum\tilde x_{1i}\tilde x_{2i}}{\sum\tilde x_{1i}^2}=\frac{3}{5}=0.6$, intercept $3.5-0.6(1.5)=2.6$.`, R`Subspace fit goes through 0 with slope ≈ 2.14 (top eigenvector of $XX'$).`],
        answer: R`affine $x_2=x_1+2$; LS $x_2=2.6+0.6x_1$` },
      check: { q: "A fitted line misses the origin. Could it be a subspace approximation?", opts: ["No, R(U) always contains 0", "Yes, if r = 1", "Yes, if the data are centered", "Only with vertical errors"], a: 0,
        why: "Exam bank 24: answer + one reason. An affine fit could, since it passes through x̄." } },

    { id: "u10s10", title: "PCA on MNIST zeros", src: "10/29 notes (demo-pca-mnist.jl)",
      nick: "Fat, skinny, tilted",
      intuition: R`5,923 images of the digit 0, each 28×28, so each is a point in $\R^{784}$ and $X$ is $784\times5923$. The cloud doesn't pass through the all-black image (the origin), so use an **affine** fit. With $r=2$: $\hat x=\bar x+\text{PC}_1U_{:,1}+\text{PC}_2U_{:,2}$. $U_{:,1}$ makes the zero fatter or skinnier, $U_{:,2}$ tilts it. Walk too far and images get weird: the affine space is infinite, the cloud is not. Images must be **aligned**, or shifts dominate.`,
      weird: R`**Weird rule:** $\op{svd}(X-\bar x1_n')\ne\op{svd}(X)-\op{svd}(\bar x1_n')$. The estimated subspace is **not a linear function of the data**, even though it is a "linear model".`,
      math: R`$$\hat x=\bar x+\text{PC}_1\,U_{:,1}+\text{PC}_2\,U_{:,2},\qquad U=\text{left sing. vecs of }X-\bar x1_n'$$`,
      mathNote: R`$r=2$ only for visualization. $r=784$ reproduces the data exactly: no compression, no structure learned.`,
      example: { q: "What are the sizes of X, x̄, and x̄1ₙ′ in the demo?",
        steps: ["One column per image, one row per pixel: 784 × 5923.", "x̄ averages the columns: 784 × 1.", "The megaphone copies x̄ into all 5923 columns."],
        answer: "784 × 5923, 784 × 1, 784 × 5923" },
      check: { q: "Why an affine fit for MNIST zeros instead of a subspace fit?", opts: ["The cloud doesn't pass through the all-black image", "784 is larger than the number of PCs we keep", "Subspace fits need a square data matrix X", "The images are not aligned with each other"], a: 0,
        why: "A subspace must contain 0, the all-black image. The zeros live far from it." } }
  ],

    { id: "u10d4", stone: "u10s2", type: "mcq", q: R`$A\in\R^{4\times5}$, rank 2. How many zero eigenvalues does $A'A$ have?`, opts: ["3", "2", "1", "5"], a: 0, why: R`$A'A$ is $5\times5$: $5-2=3$.` },

    { id: "u10d6", stone: "u10s3", type: "mcq", q: R`$\frac1nXX'$ estimates…`, opts: [R`$E[xx']$, the correlation`, R`$E[x]$, the mean`, R`$E[x'x]$ only`, R`the singular values`], a: 0, why: R`Entry $(i,j)$ averages $(x_l)_i(x_l)_j$.` },
    { id: "u10d7", stone: "u10s3", type: "first", q: R`First move to get the eigenvalues of $\frac1nXX'$ from $X=P\Sigma Q'$?`, opts: [R`Square each $\sigma_i$, divide by $n$`, R`Divide each $\sigma_i$ by $n$ only`, R`Take $\sqrt{\sigma_i}$ of each one`, R`Invert each $\sigma_i$, times $n$`], a: 0, why: R`$\lambda_i=\sigma_i^2/n$.` },
    { id: "u10d8", stone: "u10s4", type: "mcq", q: R`For fixed $U$ and $b$, the closest point of $\mathcal{R}(U)+b$ to $x_i$ has coordinates…`, opts: [R`$z=U'(x_i-b)$`, R`$z=U'x_i$`, R`$z=U'b$`, R`$z=U(x_i-b)$`], a: 0, why: R`LS with "y" $=x_i-b$, "A" $=U$, and $U^{\dagger}=U'$.` },

    { id: "u10d11", stone: "u10s6", type: "mcq", q: R`$(I-UU')^2$ equals (with $U'U=I$)…`, opts: [R`$I-UU'$`, R`$I$`, R`$I-2UU'$`, R`$0$`], a: 0, why: R`$I-2UU'+UU'UU'=I-UU'$: idempotent.` },

  practice: [
    { id: "u10p1", title: "Center, covariance, PCA by hand", src: "10/15 board", stone: "u10s8",
      q: R`Data $x_1=\mat{0\\3},x_2=\mat{1\\2},x_3=\mat{2\\5},x_4=\mat{3\\4}$. Find $\bar x$, $\tilde X$, $C=\frac1n\tilde X\tilde X'$, the principal directions, and the variance along each.`,
      hints: [R`$\bar x=\frac14X1_4$.`, R`$C$ is $2\times2$: diagonal entries are averages of squared centered coordinates.`, R`Try $\mat{1\\1}$ and $\mat{1\\-1}$ as eigenvectors.`],
      solution: [R`$\bar x=\mat{1.5\\3.5}$.`, R`$\tilde X=\mat{-1.5&-0.5&0.5&1.5\\-0.5&-1.5&1.5&0.5}$.`, R`$\tilde X\tilde X'=\mat{5&3\\3&5}$, so $C=\mat{1.25&0.75\\0.75&1.25}$.`, R`$C\mat{1\\1}=2\mat{1\\1}$, $C\mat{1\\-1}=0.5\mat{1\\-1}$.`, R`$u_1=\frac1{\sqrt2}\mat{1\\1}$ (variance 2), $u_2=\frac1{\sqrt2}\mat{1\\-1}$ (variance 0.5).`],
      answer: R`$u_1=\frac1{\sqrt2}\mat{1\\1}$, var 2; $u_2=\frac1{\sqrt2}\mat{1\\-1}$, var 0.5` },
    { id: "u10p2", title: "Which offsets are optimal?", src: "10/13 board", stone: "u10s5",
      q: R`Same data ($\bar x=\mat{1.5\\3.5}$). Take the affine fit with $r=1$ and $U=u_1=\frac1{\sqrt2}\mat{1\\1}$. Describe all optimal $b^*$, and say whether $b=\mat{0\\2}$ and $b=\mat{0\\0}$ are optimal.`,
      hints: [R`$b^*=(I-UU')\bar x+\mathcal{R}(U)$.`, R`$b$ is optimal iff $b-\bar x\in\mathcal{R}(U)$.`],
      solution: [R`$UU'=\frac12\mat{1&1\\1&1}$, $(I-UU')\bar x=\frac12\mat{1&-1\\-1&1}\mat{1.5\\3.5}=\mat{-1\\1}$.`, R`$b^*=\mat{-1\\1}+t\mat{1\\1}$: the line $x_2=x_1+2$ itself.`, R`$\mat{0\\2}$: $t=1$ ✓ optimal. $\mat{0\\0}$: needs $-1+t=0$ and $1+t=0$ ✗.`],
      answer: R`$b^*$ = any point on $x_2=x_1+2$; $\mat{0\\2}$ yes, $\mat{0\\0}$ no` },
    { id: "u10p3", title: "HW5 P3: three fits, three errors", src: "HW5 P3 (Oct 20 notes) · exam bank Likely 21", stone: "u10s9",
      q: R`Same four points. (a) Affine line and its total squared perpendicular error. (b) LS line $x_2=a_1+a_2x_1$ and its total squared vertical error. (c) Why are they different lines?`,
      hints: [R`Perpendicular error of the affine fit $=n\lambda_2$.`, R`$\hat a=\mat{1_4&x}^{\dagger}y$ with $x=(0,1,2,3)$, $y=(3,2,5,4)$.`],
      solution: [R`(a) $x_2=x_1+2$. Error $=\sum_i(u_2'\tilde x_i)^2=4\cdot0.5=2$.`, R`(b) slope $3/5=0.6$, intercept $2.6$. Residuals $0.4,-1.2,1.2,-0.4$, squared sum $3.2$.`, R`(c) Different errors: vertical (predict $x_2$ from $x_1$) vs perpendicular (treat both symmetrically).`],
      answer: R`affine $x_2=x_1+2$, error 2; LS $x_2=2.6+0.6x_1$, error 3.2` },
    { id: "u10p4", title: "Eigenvalues from singular values", src: "HW4 P4 (prep) · Quiz 4 · exam bank 10", stone: "u10s2",
      q: R`$A\in\R^{4\times5}$ has singular values $3,1$ (rank 2). List all eigenvalues of $AA'$ and of $A'A$. Then: if $A$ were data with $n=5$ columns, what are the nonzero eigenvalues of $\frac15AA'$?`,
      hints: [R`$AA'=U(\Sigma\Sigma')U'$ is $4\times4$.`, R`Divide by $n$: $\lambda_i=\sigma_i^2/n$.`],
      solution: [R`$AA'$: $9,1,0,0$.`, R`$A'A$: $9,1,0,0,0$.`, R`$\frac15AA'$: $9/5=1.8$ and $1/5=0.2$ (plus two zeros).`],
      answer: R`$\{9,1,0,0\}$, $\{9,1,0,0,0\}$, $\{1.8,0.2\}$` },
    { id: "u10p5", title: "The centering operator is a projection", src: "10/15 board", stone: "u10s6",
      q: R`Let $H=I-\frac1n1_n1_n'$. (a) Write $H$ for $n=3$. (b) Show $H^2=H$. (c) What is $H1_n$, and what does that say about $\tilde X1_n$?`,
      hints: [R`$1_n'1_n=n$.`, R`Expand $(I-\frac1n1_n1_n')^2$.`],
      solution: [R`(a) $H=\frac13\mat{2&-1&-1\\-1&2&-1\\-1&-1&2}$.`, R`(b) $H^2=I-\frac2n1_n1_n'+\frac1{n^2}1_n(1_n'1_n)1_n'=I-\frac1n1_n1_n'=H$.`, R`(c) $H1_n=1_n-\frac1n1_nn=0$, so $\tilde X1_n=XH1_n=0$: centered data average to 0.`],
      answer: R`$H^2=H$, $H1_n=0$, centered data have mean 0` }
  ],

  proofs: [
    { id: "u10pr1", title: "Optimal offset is (I − UU′)x̄ + R(U)", src: "10/13 board", star: true,
      goal: R`For fixed $U$ ($U'U=I$), show $\argmin_b\frac1n\sum_i\norm{U^{\perp}U^{\perp\prime}(x_i-b)}^2=(I-UU')\bar x+\mathcal{R}(U)$.`,
      steps: [
        { line: R`$\frac1n\sum_i\norm{U^{\perp}U^{\perp\prime}(x_i-b)}^2=\frac1n\norm{U^{\perp\prime}(X-b1_n')}_F^2$`, why: R`Stack columns into a Frobenius norm; $\norm{U^{\perp}w}=\norm{w}$` },
        { line: R`$=\frac1n\op{tr}\big(U^{\perp\prime}XX'U^{\perp}\big)-\frac2n\op{tr}\big(U^{\perp\prime}X1_nb'U^{\perp}\big)+\op{tr}\big(U^{\perp\prime}bb'U^{\perp}\big)$`, why: R`$\norm{M}_F^2=\op{tr}(MM')$, expand; $1_n'1_n=n$` },
        { line: R`$=\text{const}-2(U^{\perp\prime}b)'(\frac1nU^{\perp\prime}X1_n)+\norm{U^{\perp\prime}b}^2$`, why: "Cyclic trace turns each term into an inner product; first term doesn't depend on b" },

/* Unit 11: Low-rank approximation.

window.SPAN_ADD("u11", {
  blurb: "Find the best rank-r matrix: it splits column by column into subspace approximation, so the answer is the SVD with every singular value past the first r zeroed out.",
  sources: "10/15 board (2nd half) · 10/20 part 1 + part 2 boards · Oct 20 notes · HW5 P4 (prep, exam bank Possible 1) · Exam 1 bank (20, 25, Likely 20)",

  stones: [
    { id: "u11s1", title: "Quiz 4: use what the homework showed", src: "10/20 part 1 board · Oct 20 notes",
      nick: "Cite, don't re-derive",
      intuition: R`Quiz 4 debrief, his rule: "anything already shown in the homework, you just need to use." $A$ has rank 2. Q1: $A(\alpha v_1+\beta v_3)$ is a recipe, and $v_3$ is past the rank so $Av_3=0$. Q2: nonzero eigenvalues of $AA'$ come straight from HW4 P4. Q3: $\norm{A}_F=\norm{\op{vec}A}$ is one line using HW4 P6.`,
      math: R`$$A(\alpha v_1+\beta v_3)=\alpha\sigma_1u_1+\beta\cdot0,\qquad AA'=U\underbrace{\Sigma\Sigma'}_{\Lambda}U',\qquad \norm{A}_F=\sqrt{\op{tr}(A'A)}=\sqrt{\op{vec}(A)'\op{vec}(A)}$$`,
      mathNote: R`Full $\Sigma=\mat{\tilde\Sigma&0\\0&0}$ so $\Sigma\Sigma'=\mat{\tilde\Sigma^2&0\\0&0}$ ($d\times d$). $AA'$ has $d-r$ zero eigenvalues, $A'A$ has $n-r$. If $A$ is invertible, the eigenvalues are all nonzero, not all equal.`,
      example: { q: R`$A\in\R^{4\times5}$, rank 2. What is $A(\alpha v_2+\beta v_4)$? And $A'(u_1+u_3)$?`,
        steps: [R`$Av_2=\sigma_2u_2$; $v_4$ is past $r=2$, so $Av_4=0$.`, R`$A'u_1=\sigma_1v_1$; $A'u_3=0$.`],
        answer: R`$\alpha\sigma_2u_2$ and $\sigma_1v_1$` },
      check: { q: R`$A$ has rank 2, $\sigma_1=4,\sigma_2=3$. Nonzero eigenvalues of $AA'$?`, opts: ["16 and 9", "4 and 3", "2 and √3", "25 only"], a: 0, why: R`HW4 P4: $\Lambda=\Sigma\Sigma'$, so $\sigma_i^2$.` } },

    { id: "u11s2", title: "A third equivalent problem", src: "10/15 board",
      nick: "Best rank-r stand-in",
      intuition: R`Given a matrix $X\in\R^{d\times n}$ and $r$, find the matrix $Y$ with rank $\le r$ that best fits $X$. It looks new, but it is the **third** face of the problem we already solved (after subspace and affine approximation).`,
      visual: "lowrank",
      math: R`$$\argmin_{Y\in\R^{d\times n}}\ \norm{X-Y}_F^2\quad\text{subject to}\quad\op{rank}Y\le r$$`,
      mathNote: R`$\norm{\cdot}_F^2$ adds up every squared entry, so this asks for the closest rank-$r$ matrix entry by entry.`,
      example: { q: R`Is $Y=\mat{1&2\\2&4}$ allowed when $r=1$?`,
        steps: [R`Column 2 is $2\times$ column 1, so $\op{rank}Y=1$.`],
        answer: R`Yes, rank 1 $\le r$` },
      check: { q: R`What does $\norm{X-Y}_F^2$ add up?`, opts: ["every squared entry of X − Y", "the squared singular values of X", "the diagonal of X − Y", "the largest column error"], a: 0, why: R`Frobenius norm² = sum of all $|(X-Y)_{ij}|^2$.` } },

    { id: "u11s3", title: "Rank ≤ r means Y = UZ", src: "10/15 board · 10/20 part 2 board",
      nick: "r ingredients, any recipe",
      intuition: R`Thin SVD: rank $Y\le r$ ⇒ $Y=U\Sigma V'$ with $U\in\R^{d\times r}$, so $Y=UZ$ with $Z=\Sigma V'$. Conversely, every column of $UZ$ is in $\mathcal{R}(U)$, so $\op{rank}(UZ)\le\op{rank}U\le r$. So "rank ≤ r" is the same as "every column is a recipe of $r$ orthonormal ingredients".`,
      math: R`$$\op{rank}Y\le r\iff Y=UZ,\quad U\in\R^{d\times r},\ U'U=I_r,\ Z\in\R^{r\times n}$$`,
      mathNote: R`On the 10/15 board he first wrote $Y=UQ'$ with $Q'Q$ diagonal, crossed the diagonal condition out, and renamed $Q'$ as a free $Z$ (in red).`,
      example: { q: R`Write $Y=\mat{1&2\\2&4}$ as $UZ$ with $U'U=1$.`,
        steps: [R`Columns are multiples of $\mat{1\\2}$; normalize: $U=\frac1{\sqrt5}\mat{1\\2}$.`, R`$Z=U'Y=\frac1{\sqrt5}\mat{5&10}=\mat{\sqrt5&2\sqrt5}$.`],
        answer: R`$U=\frac1{\sqrt5}\mat{1\\2}$, $Z=\mat{\sqrt5&2\sqrt5}$` },
      check: { q: R`If $U\in\R^{d\times r}$ and $Z\in\R^{r\times n}$, the rank of $UZ$ is at most…`, opts: ["r", "d", "n", "d·n"], a: 0, why: R`Its columns live in $\mathcal{R}(U)$, which has dimension $\le r$.` } },

    { id: "u11s4", title: "It separates by columns: Z = U′X", src: "10/20 part 2 board", star: true,
      nick: "One LS per column",
      intuition: R`Solve for $Z$ first. Frobenius norm² = sum of column norms², and column $i$ only involves $z_i$. "Can solve wrt each $z_i$ separately!" Each is least squares with "y" $=x_i$, "A" $=U$: $z_i=U^{\dagger}x_i=U'x_i$ since $U'U=I$. Stack them: $Z=U'X$.`,
      math: R`$$\norm{X-UZ}_F^2=\norm{x_1-Uz_1}^2+\cdots+\norm{x_n-Uz_n}^2\ \Rightarrow\ z_i=U'x_i,\ \ Z=U'X$$`,
      example: { q: R`$U=e_1\in\R^2$, $X=\mat{3&1\\4&-2}$. Find $Z$ and $UZ$.`,
        steps: [R`$Z=U'X=$ row 1 of $X$ $=\mat{3&1}$.`, R`$UZ=\mat{3&1\\0&0}$.`],
        answer: R`$Z=\mat{3&1}$, $UZ=\mat{3&1\\0&0}$` },
      check: { q: R`Why is $z_i=U'x_i$ and not $(U'U)^{-1}U'x_i$?`, opts: [R`They are equal because $U'U=I$`, R`Because $U'U$ is not invertible`, R`Because $U'$ is the inverse of $U$`, R`Because the data $X$ is square`], a: 0, why: R`$U^{\dagger}=(U'U)^{-1}U'=U'$ for orthonormal columns.` } },

    { id: "u11s5", title: "Just subspace approx!", src: "10/15 board · 10/20 part 2 board",
      nick: "Same problem, third time",
      intuition: R`Plug $Z=U'X$ back in. What's left is $\norm{X-UU'X}_F^2$ over $U'U=I_r$: "just subspace approx!" So $U=P_{:,1:r}$ where $X=P\Sigma Q'$. All three problems (subspace, affine, low-rank) point to the same SVD.`,
      math: R`$$\argmin_{U'U=I_r}\ \norm{X-UU'X}_F^2\ \Rightarrow\ \blu{U=P_{:,1:r}},\qquad X=P\Sigma Q'$$`,
      mathNote: "His 10/20 summary board: subspace approx ⇒ P:,1:r; affine approx ⇒ subspace approx of centered data; PCA ⇒ same as affine approx; low-rank (today) ⇒ subspace approx.",
      example: { q: R`$X=\op{diag}(3,2,1)$, $r=1$. What is $U$?`,
        steps: [R`$X$ is already an SVD with $P=I$, $\sigma=3,2,1$.`],
        answer: R`$U=P_{:,1}=e_1$` },
      check: { q: "Low-rank approximation reduces to…", opts: ["subspace approximation of X", "affine approximation of X", "least squares with A = X", "PCA of X′"], a: 0, why: R`After $Z=U'X$ the objective is $\norm{X-UU'X}_F^2$.` } },

    { id: "u11s6", title: "Zero out the small singular values", src: "10/20 part 2 board",
      nick: "Keep the loudest r",
      intuition: R`Now compute $Z=U'X=P_{:,1:r}'P\Sigma Q'$. $P_{:,1:r}'P=\mat{I_r&0}$ picks the first $r$ rows of $\Sigma$, then the first $r$ rows of $Q'$. So $Y=UZ$ is the SVD with everything past $r$ dropped. "Take SVD of $X$ & just zero out all sing vals past first $r$!"`,
      visual: "lowrank",
      math: R`$$Z=\Sigma_{1:r,1:r}Q_{:,1:r}',\qquad \grn{Y=P_{:,1:r}\Sigma_{1:r,1:r}Q_{:,1:r}'=\sigma_1p_1q_1'+\cdots+\sigma_rp_rq_r'}$$`,
      mathNote: R`Compare with the thin SVD of $X$: $X=P_{:,1:k}\Sigma_{1:k,1:k}Q_{:,1:k}'$, $k=\op{rank}X$. Truncate $k\to r$.`,
      example: { q: R`$X=\op{diag}(3,2,1)$. Best rank-1 and rank-2 approximations?`,
        steps: [R`Rank 1: keep $\sigma_1=3$: $\op{diag}(3,0,0)$.`, R`Rank 2: keep $3,2$: $\op{diag}(3,2,0)$.`],
        answer: R`$\op{diag}(3,0,0)$, $\op{diag}(3,2,0)$` },
      check: { q: R`$X=\sum_{j=1}^{4}\sigma_jp_jq_j'$. The best rank-2 approximation keeps…`, opts: [R`$\sigma_1p_1q_1'+\sigma_2p_2q_2'$`, R`$\sigma_3p_3q_3'+\sigma_4p_4q_4'$`, R`$\sigma_1p_1q_1'+\sigma_4p_4q_4'$`, R`$\sigma_2p_2q_2'+\sigma_3p_3q_3'$`], a: 0, why: "The r largest singular values: the first r terms." } },

    { id: "u11s7", title: "Eckart–Young–Mirsky and the error", src: "10/20 part 2 board · Oct 20 notes · exam bank 25",
      nick: "Error = what you threw away",
      intuition: R`The boxed name for this result is the **Eckart–Young–Mirsky** theorem. The leftover $X-Y$ is exactly the dropped terms, so its squared Frobenius norm is the sum of the dropped $\sigma^2$ (HW5 P2: $\norm{A}_F^2=\sum\sigma_i^2$).`,
      math: R`$$\min_{\op{rank}Y\le r}\norm{X-Y}_F^2=\red{\sigma_{r+1}^2+\cdots+\sigma_k^2},\qquad k=\op{rank}X$$`,
      mathNote: R`$X-Y=\sum_{j>r}\sigma_jp_jq_j'$: an SVD in its own right, so its $\norm{\cdot}_F^2$ is the sum of its squared singular values.`,
      example: { q: R`Exam bank 25: best rank-1 approximation of $A=\op{diag}(3,2,1)$ and $\norm{A-\hat A}_F$.`,
        steps: [R`$\hat A=\sigma_1u_1v_1'=\op{diag}(3,0,0)$.`, R`Error$^2=\sigma_2^2+\sigma_3^2=4+1=5$.`],
        answer: R`$\hat A=\op{diag}(3,0,0)$, $\norm{A-\hat A}_F=\sqrt5$` },
      check: { q: R`Singular values $5,3,2,1$. Squared error of the best rank-2 approximation?`, opts: ["5", "34", "1", "√5"], a: 0, why: R`$\sigma_3^2+\sigma_4^2=4+1=5$.` } },

    { id: "u11s8", title: "HW5 P4: approximate the average", src: "HW5 P4 (prep) · exam bank Possible 1", star: true,
      nick: "Average first, then truncate",
      intuition: R`Given many noisy copies $A_1,\ldots,A_L$, find the rank-$K$ matrix closest to all of them on average. Expand each $\norm{X-A_l}_F^2$, average over $l$, complete the square: the objective is $\norm{X-\bar A}_F^2$ plus things that don't depend on $X$. So just take the truncated SVD of the **average** $\bar A$.`,
      math: R`$$\frac1L\sum_{l=1}^{L}\norm{X-A_l}_F^2=\norm{X-\bar A}_F^2+\underbrace{\frac1L\sum_l\norm{A_l}_F^2-\norm{\bar A}_F^2}_{\text{no }X},\qquad \bar A=\frac1L\sum_lA_l$$`,
      mathNote: R`Same complete-the-square move as the optimal offset $\bar x$ in Unit 10.`,
      example: { q: R`$A_1=\op{diag}(4,0)$, $A_2=\op{diag}(2,2)$, $K=1$. Best rank-1 $X$?`,
        steps: [R`$\bar A=\op{diag}(3,1)$.`, R`Truncate: keep $\sigma_1=3$.`],
        answer: R`$X=\op{diag}(3,0)$` },

  ],

        s += ln(u, "var(--blu)", o.wu || 5, null); if (uh) s += ln(uh, "var(--grn)", o.wh || 2.5, "7 5");
        return `<svg class="sn-svg" viewBox="0 0 ${W} ${H}" style="overflow:hidden">${s}</svg>`;
      };
      const legend = `<div class="sn-leg"><span style="--c:var(--blu)">true u</span><span style="--c:var(--grn)">û from SVD of X</span></div>`;

      if (round.kind === "needle") {
        const { u, v, th, sg, N } = round; const n = u.length;
        const S = range(n).map(i => range(n).map(j => th * u[i] * v[j])); const X = range(n).map(i => range(n).map(j => S[i][j] + sg * N[i][j]));
        const vmS = Math.max(...S.flat().map(Math.abs)); const sorted = X.flat().map(Math.abs).sort((a, b) => a - b); const vmX = Math.max(vmS, sorted[Math.floor(sorted.length * 0.97)]);
        stage.innerHTML = css + `<div class="sn-row"><div><div>${heat(S, 7, vmS)}</div><div class="sn-cap">signal S = θuv′</div></div><div><div>${heat(X, 15, vmX)}</div><div class="sn-cap">what you get: X = S + σN</div></div></div><div id="snRev"></div>`;
        stage.appendChild(K.choices(["<b>Found it</b><br><span class='small'>û ≈ u</span>", "<b>Lost in noise</b><br><span class='small'>û ≠ u</span>"], i => ctx.submit({ pick: i }), { cols: 2 }));
        ctx.after(() => {
          const all = u.concat(round.uh); const mp = Math.max(0.001, ...all), mn = Math.max(0, ...all.map(x => -x)); const mx = Math.max(mp, mn); const top = Math.round(100 * mp / (mp + mn));
          const pair = range(n).map(i => `<div style="flex:1;display:flex;flex-direction:column;height:100%;justify-content:center;gap:0"><div style="height:${top}%;display:flex;align-items:flex-end;gap:1px">${[u[i], round.uh[i]].map((x, k) => `<i style="flex:1;height:${x > 0 ? 100 * x / mp : 0}%;background:${k ? "var(--grn)" : "var(--blu)"};border-radius:2px 2px 0 0"></i>`).join("")}</div><div style="height:${100 - top}%;display:flex;align-items:flex-start;gap:1px">${[u[i], round.uh[i]].map((x, k) => `<i style="flex:1;height:${x < 0 ? -100 * x / (mn || 1) : 0}%;background:${k ? "var(--grn)" : "var(--blu)"};border-radius:0 0 2px 2px"></i>`).join("")}</div></div>`).join("");

          stage.querySelector("#snRev").innerHTML = `<div class="sn-read"><span>entries of <span style="color:var(--blu)">u</span> vs <span style="color:var(--grn)">û</span></span><span style="color:var(--grn)">|û′u|² = ${f2(round.fit)}</span></div><div style="display:flex;gap:3px;height:76px;margin-top:4px">${pair}</div>
            <div class="sn-read" style="margin-top:8px"><span>singular values of X</span><span class="small">σ₁ signal, rest noise</span></div><div class="sn-bars">${round.sv.map((s, k) => `<i style="height:${Math.max(2, 100 * s / svm)}%;background:${k ? "var(--red)" : "var(--blu)"}"></i>`).join("")}</div>`;
        });
        return;
      }

      if (round.kind === "rank") {
        const { ex, u, z0, N } = round;
        stage.innerHTML = css + `<div class="sn-tbl">${ex.map((e, i) => `<div><b>${AB[i]}</b>θ = ${e.th}<br>σ = ${e.sg}</div>`).join("")}</div><div id="snRev"></div>`;
        stage.appendChild(K.choices(round.opts.map(t => `<b style="font-size:20px">${t}</b>`), i => ctx.submit({ pick: i }), { cols: 2 }));
        ctx.after(() => { stage.querySelector("#snRev").innerHTML = `<div class="sn-tbl">${ex.map((e, i) => { const X = [0, 1].map(k => z0.map((z, j) => e.th * u[k] * z + e.sg * N[k][j])); const { uh } = top2(X); return `<div style="padding:6px">${cloud(X, u, uh, 100, 100, { dot: 2.4, wu: 4, wh: 2 })}<span style="color:var(--grn)">${AB[i]}: ${f2(e.fit)}</span></div>`; }).join("")}</div>${legend}`; });
        return;
      }

      if (round.kind === "tune") {
        const { u, z0, N, sg, grid, fits, target } = round; let th = grid[0], reveal = false;
        stage.innerHTML = css + `<div id="snC"></div>${legend}<div><div class="sn-meter" id="snM"><i></i><b style="left:calc(${100 * target}% - 1px)"></b></div><div class="sn-read" style="margin-top:6px"><span id="snF"></span><span style="color:#FFC857">target ${target}</span></div></div><div class="small" id="snS" style="text-align:center"></div><div class="gsteps" id="snSt"></div>`;
        const upd = () => {
          const X = build2(u, z0, N, th, sg); const T = top2(X); const k = grid.findIndex(g => Math.abs(g - th) < 1e-9); const f = fits[k]; const ok = f >= target;
          stage.querySelector("#snC").innerHTML = cloud(X, u, T.uh, 320, 230);
          const m = stage.querySelector("#snM>i"); m.style.width = (100 * f) + "%"; m.style.background = ok ? "var(--grn)" : "var(--red)";
          stage.querySelector("#snF").innerHTML = `|û′u|² = <b style="color:${ok ? "var(--grn)" : "var(--red)"}">${f3(f)}</b>${reveal ? ` <span style="color:var(--grn)">· threshold θ = ${round.answer.theta}</span>` : ""}`;
          stage.querySelector("#snS").textContent = `σ₁(X) = ${f2(T.s[0])} (signal)  ·  σ₂(X) = ${f2(T.s[1])} (noise)  ·  noise level σ = ${sg}`;
        };
        const st = K.stepper("θ", th, { min: grid[0], max: grid[grid.length - 1], step: 0.25, name: "signal strength", onChange: v => { th = v; upd(); } });
        stage.querySelector("#snSt").appendChild(st); upd();
        ctx.lockButton(() => ({ theta: th }));
        ctx.after(() => { reveal = true; th = round.answer.theta; upd(); });
        return;
      }

      if (round.kind === "align") {
        const W = 200, H = 160, sc = 62, P = p => [W / 2 + p[0] * sc, H / 2 - p[1] * sc];
        const arrow = (d, col, w, lab) => { const [x, y] = P(d); const ang = Math.atan2(y - H / 2, x - W / 2), hl = 11; return `<line x1="${W / 2}" y1="${H / 2}" x2="${x}" y2="${y}" style="stroke:${col};stroke-width:${w};stroke-linecap:round"/><polygon points="${x},${y} ${x - hl * Math.cos(ang - .45)},${y - hl * Math.sin(ang - .45)} ${x - hl * Math.cos(ang + .45)},${y - hl * Math.sin(ang + .45)}" style="fill:${col}"/><text x="${x + 8 * Math.cos(ang)}" y="${y + 8 * Math.sin(ang) + 4}" style="fill:${col};font:800 14px system-ui">${lab}</text>`; };
        stage.innerHTML = css + `<svg class="sn-svg" viewBox="0 0 ${W} ${H}" style="max-width:300px;margin:0 auto"><circle cx="${W / 2}" cy="${H / 2}" r="${sc}" style="fill:none;stroke:rgba(178,186,255,.18)"/><line x1="0" y1="${H / 2}" x2="${W}" y2="${H / 2}" style="stroke:rgba(178,186,255,.12)"/><line x1="${W / 2}" y1="0" x2="${W / 2}" y2="${H}" style="stroke:rgba(178,186,255,.12)"/>${arrow(round.u, "var(--blu)", 4, "u")}${arrow(round.uh, "var(--grn)", 3, "û")}</svg>`;
        stage.appendChild(K.choices(round.opts.map(t => `<b style="font-size:21px">${t.replace("-", "−")}</b>`), i => ctx.submit({ pick: i }), { cols: 2 }));
        return;
      }

      stage.innerHTML = css;
      const long = round.opts.some(t => t.length > 14);
      stage.appendChild(K.choices(round.opts.map(t => `<b style="font-size:${long ? 16 : 20}px">${t}</b>`), i => ctx.submit({ pick: i }), { cols: long ? 1 : 2 }));
    }
  });
})();

}catch(e){console.warn("game load failed src/games/u12-signal.js",e)}

<script id="span-math">
/* Tiny TeX-subset → native MathML. No libraries, works offline. */
const SPANMath = (() => {
  const SYM = {
    alpha:"α",beta:"β",gamma:"γ",delta:"δ",epsilon:"ϵ",varepsilon:"ε",eta:"η",theta:"θ",lambda:"λ",mu:"μ",pi:"π",sigma:"σ",tau:"τ",phi:"φ",psi:"ψ",omega:"ω",
    Sigma:"Σ",Lambda:"Λ",Delta:"Δ",Omega:"Ω",Phi:"Φ",
    R:"ℝ",C:"ℂ",N:"ℕ"
  };
  const OPS = {
    in:"∈",notin:"∉",cdots:"⋯",ldots:"…",vdots:"⋮",ddots:"⋱",le:"≤",ge:"≥",leq:"≤",geq:"≥",ne:"≠",neq:"≠",perp:"⊥",dagger:"†",ast:"*",star:"∗",
    cdot:"·",times:"×",to:"→",Rightarrow:"⇒",iff:"⇔",approx:"≈",infty:"∞",forall:"∀",exists:"∃",langle:"⟨",rangle:"⟩",mid:"∣",circ:"∘",
    subseteq:"⊆",supseteq:"⊇",cup:"∪",cap:"∩",emptyset:"∅",sim:"∼",pm:"±",prime:"′",colon:":",vert:"|","|":"‖",
    "{":"{","}":"}",";":" ",",":" ",quad:" ",qquad:"  "
  };
  const WORDS = new Set(["op","text"]);
  const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

  function tokenize(s){
    const t=[]; let i=0;
    while(i<s.length){
      const c=s[i];
      if(c==="\\"){
        let j=i+1;
        if(/[A-Za-z]/.test(s[j]||"")){ while(j<s.length && /[A-Za-z]/.test(s[j])) j++; t.push({k:"cmd",v:s.slice(i+1,j)}); i=j; }
        else { t.push({k:"cmd",v:s[j]}); i=j+1; }

    function rawGroup(){ // {plain text}

    }
    function wrap(arr){ return arr.length===1?arr[0]:`<mrow>${arr.join("")}</mrow>`; }
    function matrix(){
      // \mat{a & b \\ c & d}
      p++; // {
      const rows=[[[]]]; let depth=0;
      while(p<t.length){
        const k=peek();
        if(k.k==="ch"&&k.v==="}"&&depth===0){ p++; break; }
        if(k.k==="ch"&&k.v==="&"&&depth===0){ p++; rows[rows.length-1].push([]); continue; }
        if(k.k==="cmd"&&k.v==="\\"&&depth===0){ p++; rows.push([[]]); continue; }
        const r=rows[rows.length-1]; r[r.length-1].push(item());
      }
      const body=rows.filter(r=>r.some(c=>c.length)).map(r=>`<mtr>${r.map(c=>`<mtd>${wrap(c)||"<mrow></mrow>"}</mtd>`).join("")}</mtr>`).join("");
      return `<mrow class="bmat"><mtable class="bm" columnspacing="0.8em" rowspacing="0.3em">${body}</mtable></mrow>`;
    }
    function atom(){
      const k=t[p++]; if(!k) return "";

      if(k.k==="ch"){
        const c=k.v;
        if(/[A-Za-z]/.test(c)) return `<mi>${c}</mi>`;

      if(v==="hat"||v==="bar"||v==="tilde"||v==="widetilde"||v==="widehat"||v==="vec"||v==="dot"){ const ch={hat:"^",widehat:"^",bar:"¯",tilde:"~",widetilde:"~",vec:"→",dot:"˙"}[v]; return `<mover accent="true">${group()}<mo stretchy="false">${ch}</mo></mover>`; }

      if(v==="mathbf"){ return `<mi mathvariant="bold">${esc(rawGroup())}</mi>`; }

      if(v==="argmin"||v==="argmax"||v==="min"||v==="max"){ return {lim:true, html:`<mo movablelimits="false" form="prefix">${v}</mo>`}; }
      if(v==="sum"){ return {lim:true, html:`<mo largeop="true" movablelimits="false">∑</mo>`}; }
      if(v==="textstyle"){ return ""; }
      if(v==="left"||v==="right"||v==="big"||v==="Big"){ const n=t[p++]; const ch=n?(n.k==="cmd"?(OPS[n.v]||n.v):n.v):""; if(ch==="."||!ch) return ""; return `<mo stretchy="true">${esc(ch)}</mo>`; }

      if(v===";") return `<mspace width="0.28em"></mspace>`;
      if(v===" ") return `<mspace width="0.25em"></mspace>`;
      if(v==="quad") return `<mspace width="1em"></mspace>`;
      if(v==="qquad") return `<mspace width="2em"></mspace>`;
      if(v==="\\") return "";
      if(SYM[v]) return /[A-Z]/.test(v[0])&&"RCN".includes(v)?`<mi mathvariant="normal">${SYM[v]}</mi>`:(/[A-Z]/.test(v[0])?`<mi mathvariant="normal">${SYM[v]}</mi>`:`<mi>${SYM[v]}</mi>`);
      if(OPS[v]){
        const o=OPS[v];
        if(v==="langle"||v==="rangle") return `<mo stretchy="false">${o}</mo>`;
        if(v==="|") return `<mo stretchy="false">‖</mo>`;
        if(v==="dagger"||v==="prime") return `<mo lspace="0" rspace="0">${o}</mo>`;
        if(v==="{"||v==="}") return `<mo stretchy="false">${o}</mo>`;
        return `<mo>${o}</mo>`;
      }
      return `<mi>${esc(v)}</mi>`;
    }
    function item(){
      let base=atom();
      let lim=false;
      if(base&&typeof base==="object"){ lim=true; base=base.html; }
      let sub=null, sup=null;
      while(peek()&&peek().k==="ch"&&(peek().v==="_"||peek().v==="^")){
        const w=t[p++].v; const g=group();
        if(w==="_") sub=g; else sup=g;
      }
      if(lim){
        if(sub&&sup) return `<munderover>${base}${sub}${sup}</munderover>`;
        if(sub) return `<munder>${base}${sub}</munder>`;
        if(sup) return `<mover>${base}${sup}</mover>`;
        return base;
      }
      if(sub&&sup) return `<msubsup>${base||"<mrow></mrow>"}${sub}${sup}</msubsup>`;
      if(sub) return `<msub>${base||"<mrow></mrow>"}${sub}</msub>`;
      if(sup) return `<msup>${base||"<mrow></mrow>"}${sup}</msup>`;
      return base;
    }
    function seq(stops){
      const out=[];
      while(p<t.length){ const k=peek(); if(k.k==="ch"&&stops.includes(k.v)) break; out.push(item()); }
      return out;
    }
    return seq([]).join("");
  }

  function tex(src, display){
    let body;
    try { body = parse(src); } catch(e){ body = `<mtext>${esc(src)}</mtext>`; }
    return `<math${display?' display="block"':''}>${body}</math>`;
  }

  // Rich text: $$…$$ display, $…$ inline, **bold**, «code»
  function rich(s){
    if(s==null) return "";
    s=String(s);
    let out="", i=0;
    while(i<s.length){
      if(s.startsWith("$$",i)){ const j=s.indexOf("$$",i+2); if(j<0){ out+=esc(s.slice(i)); break; } out+=`<span class="mblock">${tex(s.slice(i+2,j),true)}</span>`; i=j+2; continue; }

      let txt=esc(s.slice(i,j));
      txt=txt.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/«(.+?)»/g,"<code>$1</code>");
      out+=txt; i=j;
    }
    return out;
  }
  return { tex, rich, esc };
})();

const IN_FRAME = (() => { try { return window.self !== window.top; } catch (e) { return true; } })(); // Claude preview runs in a frame: no print, no downloads // days, by Leitner box

/* ───────── store ───────── */
const blank = () => ({ v: 1, stones: {}, items: {}, days: [], sheet: [], unlockAll: false, exams: [] });
let S = blank();
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(blank(), JSON.parse(raw)); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
const dayStr = (d = new Date()) => { const z = new Date(d.getTime() - d.getTimezoneOffset() * 60000); return z.toISOString().slice(0, 10); };
const addDays = (s, n) => { const d = new Date(s + "T12:00:00"); d.setDate(d.getDate() + n); return dayStr(d); };
function touchDay() { const t = dayStr(); if (!S.days.includes(t)) { S.days.push(t); S.days = S.days.slice(-400); } }

/* ───────── content index ───────── */
const UNITS = D.units;
const unitById = id => UNITS.find(u => u.id === id);
const ITEMS = {}; // key -> {key, kind, unit, ref, label, stone}
function indexContent() {
  for (const u of UNITS) {
    (D.drill[u.id] || []).forEach(x => ITEMS[x.id] = { key: x.id, kind: "drill", unit: u.id, ref: x, stone: x.stone });
    (D.julia[u.id] || []).forEach(x => ITEMS[x.id] = { key: x.id, kind: "julia", unit: u.id, ref: x, stone: x.stone });
    (D.practice[u.id] || []).forEach(x => ITEMS[x.id] = { key: x.id, kind: "practice", unit: u.id, ref: x, stone: x.stone });
    (D.proofs[u.id] || []).forEach(x => ["order", "why", "fill"].forEach(m => ITEMS[x.id + ":" + m] = { key: x.id + ":" + m, kind: "proof", mode: m, unit: u.id, ref: x }));
  }
}
indexContent();
const stonesOf = uid => (D.stones[uid] || []);
const stoneById = id => { for (const u of UNITS) { const s = stonesOf(u.id).find(x => x.id === id); if (s) return s; } return null; };
const itemLabel = it => {
  if (it.kind === "proof") return `${it.ref.title} · ${({ order: "order the steps", why: "justify", fill: "missing line" })[it.mode]}`;
  if (it.kind === "practice") return it.ref.title;
  const st = stoneById(it.stone); return (st ? st.title : "") + (it.kind === "julia" ? " · Julia" : "");
};
const topicOf = it => it.kind === "proof" ? "Proofs" : (stoneById(it.stone) || { title: "General" }).title;

/* ───────── spaced repetition ───────── */
const rec = k => S.items[k] || (S.items[k] = { n: 0, ok: 0, miss: 0, box: 0, due: null, streak: 0, trouble: false, tStreak: 0 });
function record(k, correct) {
  const r = rec(k), t = dayStr();
  r.n++; touchDay();
  if (correct) {
    r.ok++; r.streak++; r.box = Math.min(r.box + 1, INTERVAL.length - 1);
    if (r.trouble) { r.tStreak++; if (r.tStreak >= 3) { r.trouble = false; r.tStreak = 0; r.box = Math.max(r.box, 3); } }
    r.due = addDays(t, r.trouble ? [1, 2, 4][Math.min(r.tStreak, 2)] : INTERVAL[r.box]);
  } else {
    r.miss++; r.streak = 0; r.box = 0; r.due = addDays(t, 1);
    if (r.miss >= 2) { if (!r.trouble) r.tStreak = 0; r.trouble = true; r.tStreak = 0; }
  }
  save();
}
const isMastered = k => { const r = S.items[k]; return !!r && r.box >= 2 && !r.trouble; };
function unitKeys(uid) { return Object.values(ITEMS).filter(i => i.unit === uid).map(i => i.key); }
function mastery(uid) {
  const st = stonesOf(uid); const keys = unitKeys(uid);
  const total = st.length + keys.length; if (!total) return 0;
  const done = st.filter(s => S.stones[s.id] && S.stones[s.id].solid).length + keys.filter(isMastered).length;
  return done / total;
}
const troubleKeys = () => Object.keys(S.items).filter(k => S.items[k].trouble && ITEMS[k]);
function reviewQueue(limit = 12) {
  const t = dayStr();
  const due = Object.keys(S.items).filter(k => ITEMS[k] && S.items[k].due && S.items[k].due <= t);
  const trouble = due.filter(k => S.items[k].trouble);
  const rest = due.filter(k => !S.items[k].trouble).sort((a, b) => S.items[a].box - S.items[b].box);
  const fresh = Object.values(ITEMS).filter(i => !S.items[i.key] && (i.kind === "proof" ? i.mode === "fill" : true) && (!i.stone || (S.stones[i.stone] && S.stones[i.stone].solid))).map(i => i.key);
  const q = [...new Set([...trouble, ...rest, ...fresh])];
  return q.slice(0, limit);
}
function streakDays() {
  const set = new Set(S.days); let n = 0; let d = dayStr();
  if (!set.has(d)) d = addDays(d, -1);
  while (set.has(d)) { n++; d = addDays(d, -1); }
  return n;
}
function stoneUnlocked(uid, idx) {
  if (S.unlockAll || idx === 0) return true;
  const prev = stonesOf(uid)[idx - 1]; return !!(S.stones[prev.id] && S.stones[prev.id].solid);
}

/* ───────── tiny helpers ───────── */
const $ = (sel, el = document) => el.querySelector(sel);
const app = document.getElementById("app");
function shuffle(a) { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; }

/* ── MCQ component ── */
function mcq(el, item, onDone, opts = {}) {
  const isTF = item.type === "tf";
  const options = isTF ? ["True", "False"] : item.opts;
  const answer = isTF ? (item.a ? 0 : 1) : item.a;
  const order = isTF ? [0, 1] : shuffle(options.map((_, i) => i));
  const codeCls = item.codeOpts ? "code" : "";
  el.innerHTML = `<div class="q">${item.code ? `<pre class="jl">${hlJulia(item.code)}</pre>` : ""}<p class="qtext">${rich(item.q)}</p>
    <div class="opts">${order.map((oi, j) => `<button class="opt ${codeCls}" data-j="${j}"><span class="k">${j + 1}</span><span class="ot">${item.codeOpts ? esc(options[oi]) : rich(options[oi])}</span></button>`).join("")}</div><div class="fb"></div></div>`;
  let done = false;
  const pick = j => {
    if (done || j >= order.length) return; done = true;
    const chosen = order[j], ok = chosen === answer;
    el.querySelectorAll(".opt").forEach((b, jj) => { b.disabled = true; const oi = order[jj]; if (oi === answer) b.classList.add("right"); else if (jj === j) b.classList.add("wrong"); else b.classList.add("dim"); });
    if (!opts.silent) el.querySelector(".fb").innerHTML = `<div class="feedback ${ok ? "ok" : "no"}"><b>${ok ? pickCheer() : "Not quite."}</b><span>${rich(item.why || "")}</span></div>`;
    if (ok && !opts.silent) { const r = el.querySelector(".opt.right"); r.classList.add("burst"); }
    onDone && onDone(ok, chosen, options);
  };
  el.querySelectorAll(".opt").forEach(b => b.onclick = () => pick(+b.dataset.j));
  return { pick, get done() { return done; } };
}
const CHEERS = ["That's it.", "Solid.", "Yes, exactly.", "Nailed it.", "Right on.", "Clean."];
const pickCheer = () => CHEERS[Math.floor(Math.random() * CHEERS.length)];
function hlJulia(code) {
  return esc(code).split("\n").map(line => {
    const ci = line.indexOf("#"); let body = ci >= 0 ? line.slice(0, ci) : line, cm = ci >= 0 ? line.slice(ci) : "";
    body = body.replace(/\b(using|function|end|for|in|return|im)\b/g, '<span class="kw">$1</span>').replace(/(?<![A-Za-z_])(\d+(?:\.\d+)?)/g, '<span class="nu">$1</span>');
    return body + (cm ? `<span class="cm">${cm}</span>` : "");
  }).join("\n");
}

function proofCard(el, pf, mode, onDone) {
  const steps = pf.steps;
  const goal = `<div class="pfgoal"><div class="eyebrow">Goal</div>${rich(pf.goal)}</div>`;
  if (mode === "order") {
    const order = shuffle(steps.map((_, i) => i)); let placed = 0, mistakes = 0;
    el.innerHTML = `${goal}<p class="small">Tap the lines in the order the proof goes.</p><div class="list" id="built"></div><div class="list" id="pool">${order.map(i => `<button class="pfline" data-i="${i}"><span class="n">?</span><span class="b">${rich(steps[i].line)}</span></button>`).join("")}</div><div class="fb"></div>`;
    el.querySelectorAll("#pool .pfline").forEach(b => b.onclick = () => {
      const i = +b.dataset.i;
      if (i === placed) {
        b.remove(); $("#built", el).insertAdjacentHTML("beforeend", `<div class="pfline placed"><span class="n">${placed + 1}</span><span class="b">${rich(steps[i].line)}<span class="why">${esc(steps[i].why)}</span></span></div>`); placed++;
        if (placed === steps.length) { const ok = mistakes === 0; el.querySelector(".fb").innerHTML = `<div class="feedback ${ok ? "ok" : "no"}"><b>${ok ? "Flawless order." : `Built, with ${mistakes} wrong tap${mistakes > 1 ? "s" : ""}.`}</b><span>${ok ? "Each line only uses what came before it." : "Counts as a miss this time. The order is the proof's logic, so it's worth another pass."}</span></div>`; onDone(ok); }
      } else { mistakes++; b.classList.remove("bad"); void b.offsetWidth; b.classList.add("bad"); }
    });
    return {};
  }
  if (mode === "why") {
    let k = 0, mistakes = 0; const pool = [...new Set([...steps.map(s => s.why), ...pf.whyPool])];
    el.innerHTML = `${goal}<p class="small">Pick the reason for each line.</p><div class="list" id="built"></div><div id="ask"></div><div class="fb"></div>`;
    let cur = null;
    const ask = () => {
      if (k >= steps.length) { const ok = mistakes === 0; el.querySelector(".fb").innerHTML = `<div class="feedback ${ok ? "ok" : "no"}"><b>${ok ? "Every reason right." : `${mistakes} reason${mistakes > 1 ? "s" : ""} missed.`}</b><span>On the exam, "one reason per line" is the full-credit format.</span></div>`; $("#ask", el).innerHTML = ""; onDone(ok); return; }
      const s = steps[k]; const distract = shuffle(pool.filter(w => w !== s.why)).slice(0, 3);
      const opts = [s.why, ...distract];
      $("#built", el).insertAdjacentHTML("beforeend", `<div class="pfline placed" id="ln${k}"><span class="n">${k + 1}</span><span class="b">${rich(s.line)}<span class="why">…why?</span></span></div>`);
      cur = mcq($("#ask", el), { q: "Why does this line hold?", opts, a: 0, why: "" }, ok => { if (!ok) mistakes++; $(`#ln${k} .why`, el).textContent = s.why; k++; setTimeout(ask, ok ? 350 : 1100); }, { silent: true });
    };

    return { pick: j => cur && cur.pick(j) };
  }
  // fill
  const mid = steps.length > 2 ? 1 + Math.floor(Math.random() * (steps.length - 2)) : 0;
  el.innerHTML = `${goal}<div class="list">${steps.map((s, i) => i === mid ? `<div class="pfline blank" id="blank"><span class="n">${i + 1}</span><span class="b">Missing line</span></div>` : `<div class="pfline placed"><span class="n">${i + 1}</span><span class="b">${rich(s.line)}<span class="why">${esc(s.why)}</span></span></div>`).join("")}</div><div id="ask"></div>`;
  const others = steps.filter((_, i) => i !== mid).map(s => s.line);
  const opts = [steps[mid].line, ...pf.fillDistract.slice(0, 2), shuffle(others)[0]];
  return mcq($("#ask", el), { q: "Which line fills the gap?", opts, a: 0, why: `Reason: ${steps[mid].why}.` }, ok => { $("#blank", el).outerHTML = `<div class="pfline placed"><span class="n">${mid + 1}</span><span class="b">${rich(steps[mid].line)}<span class="why">${esc(steps[mid].why)}</span></span></div>`; onDone(ok); });
}

function mountWidgets(root) { root.querySelectorAll("[data-widget]").forEach(el => { const f = WIDGETS[el.dataset.widget]; if (f) f(el); }); }
const W = 300, RANGE = 4.5, sc = v => (v / RANGE) * (W / 2);
const toSvg = ([x, y]) => [W / 2 + sc(x), W / 2 - sc(y)];
const fromSvg = (svg, evt) => { const r = svg.getBoundingClientRect(); const px = (evt.clientX - r.left) / r.width * W, py = (evt.clientY - r.top) / r.height * W; return [((px - W / 2) / (W / 2)) * RANGE, -((py - W / 2) / (W / 2)) * RANGE]; };
const fmt = v => { const r = Math.round(v * 10) / 10; return (Object.is(r, -0) ? 0 : r).toString().replace("-", "−"); };
const fmtT = v => { const r = Math.round(v * 10) / 10; return String(Object.is(r, -0) ? 0 : r); };

function markers(list) { return `<defs>${list.map(([id, c]) => `<marker id="ah-${id}" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="${c}"/></marker>`).join("")}</defs>`; }
function gridBg() { let g = ""; for (let i = -4; i <= 4; i++) { const [x] = toSvg([i, 0]), [, y] = toSvg([0, i]); g += `<line class="gridline" x1="${x}" y1="0" x2="${x}" y2="${W}"/><line class="gridline" x1="0" y1="${y}" x2="${W}" y2="${y}"/>`; } return g + `<line class="axis" x1="0" y1="${W / 2}" x2="${W}" y2="${W / 2}"/><line class="axis" x1="${W / 2}" y1="0" x2="${W / 2}" y2="${W}"/>`; }
function drag(svg, getHandles, onMove) {
  let active = null;
  svg.addEventListener("pointerdown", e => { const pt = fromSvg(svg, e); let best = null, bd = 0.9; getHandles().forEach((h, i) => { const d = Math.hypot(h[0] - pt[0], h[1] - pt[1]); if (d < bd) { bd = d; best = i; } }); if (best != null) { active = best; svg.setPointerCapture(e.pointerId); e.preventDefault(); } });
  svg.addEventListener("pointermove", e => { if (active == null) return; let [x, y] = fromSvg(svg, e); x = Math.max(-4.2, Math.min(4.2, Math.round(x * 2) / 2)); y = Math.max(-4.2, Math.min(4.2, Math.round(y * 2) / 2)); onMove(active, [x, y]); });
  const end = () => active = null; svg.addEventListener("pointerup", end); svg.addEventListener("pointercancel", end);
}
const CO = { a: "#FF8A65", b: "#7FB2FF", r: "#F4F2FF", g: "#6EE7A8" };

const WIDGETS = {
  columns(el) {

  /* low-rank approximation of a small picture */
  lowrank(el) {
    const N = 12; const img = [...Array(N)].map((_, i) => [...Array(N)].map((_, j) => { const ring = Math.abs(Math.hypot(i - 5.5, j - 5.5) - 3.6) < 1.3 ? 1 : 0; const bar = j >= 9 && i >= 2 && i <= 9 ? 0.7 : 0; return Math.max(ring, bar); }));
    const S = svdJacobi(img); let r = 2;
    el.innerHTML = `<div class="widget"><p class="wcap">A 12×12 picture X and its truncated SVD: keep the first r singular values, zero out the rest. Eckart–Young: no rank-r matrix gets closer.</p>
      <div class="row" style="justify-content:center;gap:14px;flex-wrap:nowrap"><div style="text-align:center"><div id="orig"></div><div class="small">X</div></div><div style="text-align:center"><div id="appr"></div><div class="small" id="rl">rank r</div></div></div>
      <div class="slider"><label for="wr">r</label><input id="wr" type="range" min="0" max="${N}" step="1" value="${r}"><output id="or"></output></div><div id="bars"></div><div class="wout" id="wout"></div></div>`;
    const heat = M => `<div style="display:grid;grid-template-columns:repeat(${N},11px);gap:1px">${M.flat().map(v => `<div style="width:11px;height:11px;border-radius:2px;background:rgba(255,138,101,${Math.max(0, Math.min(1, v))});outline:1px solid rgba(178,186,255,.06)"></div>`).join("")}</div>`;
    el.querySelector("#orig").innerHTML = heat(img);
    const draw = () => {
      const Y = img.map((_, i) => img[0].map((_, j) => { let t = 0; for (let k = 0; k < r; k++) t += S.s[k] * S.U[i][k] * S.V[j][k]; return t; }));
      el.querySelector("#appr").innerHTML = heat(Y); el.querySelector("#or").textContent = r; el.querySelector("#rl").textContent = `rank ${r}`;
      const mx = S.s[0];
      el.querySelector("#bars").innerHTML = `<div style="display:flex;align-items:flex-end;gap:4px;height:70px;justify-content:center">${S.s.map((s, k) => `<div title="σ${k + 1}" style="width:16px;height:${Math.max(2, 66 * s / mx)}px;border-radius:4px 4px 0 0;background:${k < r ? "var(--blu)" : "var(--red)"}"></div>`).join("")}</div>`;

    };

  /* HW3 P2: regularized least squares on the sampled sine */
  reg(el) {
    const N = 100, x = [...Array(N)].map((_, k) => Math.sin(k / 100 * 2 * Math.PI)); const rr = rng(2026);
    const y = [...Array(50)].map((_, i) => x[2 * i] + Math.sqrt(0.01) * gauss(rr)); // y = x[1:2:end] + ε  (η = 0.01)
    const LAMS = [0, 0.05, 0.5, 5, 50, 500]; let li = 1;
    el.innerHTML = `<div class="widget"><p class="wcap">HW3 P2: we see only the odd entries of x, with noise (η = 0.01). λ = 0 gives the zero-filled A†y. Turning λ up adds the smoothness penalty λ‖Dx‖².</p><svg viewBox="0 0 320 180" role="img" aria-label="Regularized reconstruction"></svg>
      <div class="slider"><label for="wl">λ</label><input id="wl" type="range" min="0" max="${LAMS.length - 1}" step="1" value="${li}"><output id="ol"></output></div><div class="wout" id="wout"></div></div>`;
    const solveReg = lam => {
      if (lam === 0) return x.map((_, k) => k % 2 === 0 ? y[k / 2] : 0);
      // (A'A + λ D'D) x = A'y, tridiagonal → Thomas algorithm
      const a = Array(N).fill(0), b = Array(N).fill(0), c = Array(N).fill(0), d = Array(N).fill(0);
      for (let k = 0; k < N; k++) { b[k] = (k % 2 === 0 ? 1 : 0) + lam * ((k > 0) + (k < N - 1)); d[k] = k % 2 === 0 ? y[k / 2] : 0; if (k > 0) a[k] = -lam; if (k < N - 1) c[k] = -lam; }
      for (let k = 1; k < N; k++) { const m = a[k] / b[k - 1]; b[k] -= m * c[k - 1]; d[k] -= m * d[k - 1]; }
      const s = Array(N); s[N - 1] = d[N - 1] / b[N - 1]; for (let k = N - 2; k >= 0; k--) s[k] = (d[k] - c[k] * s[k + 1]) / b[k]; return s;
    };
    const svg = el.querySelector("svg"); const X = k => 10 + k * 3, Y = v => 90 - v * 70;
    const draw = () => {
      const lam = LAMS[li], xh = solveReg(lam);
      const line = (arr, col, w) => `<polyline points="${arr.map((v, k) => `${X(k)},${Y(v)}`).join(" ")}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linejoin="round"/>`;
      svg.innerHTML = `<line x1="10" y1="90" x2="310" y2="90" stroke="rgba(178,186,255,.25)"/>` + line(x, "rgba(244,242,255,.55)", 4) + line(xh, CO.g, 2) + y.map((v, i) => `<circle cx="${X(2 * i)}" cy="${Y(v)}" r="2.2" fill="${CO.b}"/>`).join("") +
        `<text x="12" y="172" fill="rgba(244,242,255,.7)" style="font-size:11px">white: true x · blue: measured y · green: estimate</text>`;
      el.querySelector("#ol").textContent = lam;

      el.querySelector("#wout").innerHTML = tex(lam === 0 ? `\\hat{x}=A^{\\dagger}y` : `\\hat{x}=\\argmin_{x}\\norm{\\tilde{y}-\\tilde{A}x}^2`, true) + (lam === 0 ? `` : tex(`\\tilde{y}=\\mat{y\\\\0},\\ \\tilde{A}=\\mat{A\\\\-\\sqrt{\\lambda}D}`, true)) + `<p class="small">‖x̂ − x‖ = ${num2(e)}. ${lam === 0 ? "Jagged: zeros at every unseen time point." : lam <= 0.5 ? "Unseen points become the average of their neighbors." : lam <= 5 ? "Smooth, and the noise averages out." : "Over-smoothed: the penalty is winning, the estimate flattens toward a constant."}</p>`;
    };
    el.querySelector("#wl").oninput = e => { li = +e.target.value; draw(); };
    draw();
  },

  /* 10/29: rank-1 signal + noise */
  noise(el) {
    let sig = 0.8, seed = 1; const n = 60; const u = [Math.cos(0.6), Math.sin(0.6)];
    el.innerHTML = `<div class="widget"><p class="wcap">10/29 demo: S = u z (rank 1), X = S + σ·noise. Blue is the true direction u, green is û = first left singular vector of X. |û′u|² = 1 means a perfect estimate.</p><svg viewBox="0 0 ${W} ${W}" role="img" aria-label="Rank one plus noise"></svg>
      <div class="slider"><label for="wn">σ</label><input id="wn" type="range" min="0" max="2" step="0.05" value="${sig}"><output id="on"></output></div>
      <div class="grid2"><button class="btn small ghost" id="again">New noise draw</button><button class="btn small ghost" id="trials">Run 200 trials</button></div><div class="wout" id="wout"></div></div>`;
    const svg = el.querySelector("svg");
    const estimate = (s, sd) => { const r = rng(sd); const P = []; let a = 0, b = 0, c = 0; for (let i = 0; i < n; i++) { const z = gauss(r) * 1.6; const p = [u[0] * z + s * gauss(r), u[1] * z + s * gauss(r)]; P.push(p); a += p[0] * p[0]; b += p[0] * p[1]; c += p[1] * p[1]; } const uh = eig2(a, b, c).v[0]; return { P, uh, al: (uh[0] * u[0] + uh[1] * u[1]) ** 2 }; };
    const draw = (extra = "") => {
      const E = estimate(sig, seed); const ln = (d, col, w) => { const A_ = toSvg([-6 * d[0], -6 * d[1]]), B_ = toSvg([6 * d[0], 6 * d[1]]); return `<line x1="${A_[0]}" y1="${A_[1]}" x2="${B_[0]}" y2="${B_[1]}" stroke="${col}" stroke-width="${w}"/>`; };
      svg.innerHTML = gridBg() + E.P.map(p => { const [x, y] = toSvg(p); return `<circle cx="${x}" cy="${y}" r="3.5" fill="rgba(244,242,255,.8)"/>`; }).join("") + ln(u, CO.b, 4) + ln(E.uh, CO.g, 2.5);
      el.querySelector("#on").textContent = sig;
      el.querySelector("#wout").innerHTML = tex(`\\abs{\\hat{u}'u}^2=${num2(E.al)}`, true) + extra;
    };

    draw();
  }
});

/* ═════════ PLAY MODE ═════════ (spliced into app.js; uses app scope: S, save, go, render, VIEWS, UNITS, ITEMS, mcq, proofCard, record, rich, tex, esc, toast, countUp, goAttr, back, stonesOf, stoneById, unitById, dayStr, touchDay, shuffle, $) */
const GK = window.GameKit;
const gameState = () => (S.game = S.game || { xp: 0, lv: {}, boss: {}, bestCombo: 0, badges: [], day: null, q: {}, qDone: [], played: [] });
const RANKS = [[0, "Scalar"], [300, "Vector"], [900, "Matrix"], [2000, "Block Matrix"], [3500, "Orthonormal Basis"], [5500, "SVD Adept"], [8000, "Low-Rank Sage"], [11000, "Tensor Master"], [15000, "Hong-Level Expert"]];
const rankOf = xp => { let i = 0; RANKS.forEach((r, k) => { if (xp >= r[0]) i = k; }); const next = RANKS[i + 1]; return { i, name: RANKS[i][1], lo: RANKS[i][0], hi: next ? next[0] : null, nextName: next ? next[1] : null }; };
const gameFor = uid => (window.SPAN_GAMES || []).find(g => g.unit === uid);
const BADGES = {
  first: ["First clear", "Finish any level"], flawless: ["Flawless", "Finish a level with all 3 hearts"], combo5: ["On fire", "Hit a ×5 combo"], combo10: ["Unstoppable", "Hit a ×10 combo"],
  boss: ["Boss slayer", "Beat any boss"], clutch: ["Clutch", "Finish a level on your last heart"], expert: ["World expert", "3 stars on every level and the boss of one world"],
  half: ["Halfway there", "Beat 6 bosses"], all: ["SPAN complete", "Beat all 12 bosses"], quests: ["Quest runner", "Finish all 3 daily quests in a day"]
};
const QUESTS = {
  clear2: ["Clear 2 levels", 2], combo5: ["Hit a ×5 combo", 1], boss1: ["Beat a boss", 1], perfect1: ["Finish a level with 3 stars", 1],
  review5: ["Answer 5 review cards", 5], rounds15: ["Win 15 rounds", 15], world2: ["Play 2 different worlds", 2]
};
function questsToday() {
  const G = gameState(), t = dayStr();
  if (G.day !== t) { G.day = t; G.q = {}; G.qDone = []; G.qWorlds = []; const r = GK.R.make(+t.replace(/-/g, "")); G.qList = GK.R.shuffle(r, Object.keys(QUESTS)).slice(0, 3); save(); }
  return G.qList.map(k => ({ k, name: QUESTS[k][0], need: QUESTS[k][1], have: Math.min(QUESTS[k][1], G.q[k] || 0), done: G.qDone.includes(k) }));
}
function bumpQuest(k, n = 1) {
  const G = gameState(); questsToday(); if (!G.qList.includes(k) || G.qDone.includes(k)) return;
  G.q[k] = (G.q[k] || 0) + n;
  if (G.q[k] >= QUESTS[k][1]) { G.qDone.push(k); G.xp += 60; toast(`Quest done: ${QUESTS[k][0]} · +60 XP`); GK.sfx && GK.sfx("star"); if (G.qDone.length === 3) award("quests"); }
  save();
}
function award(id) { const G = gameState(); if (G.badges.includes(id)) return; G.badges.push(id); save(); setTimeout(() => { toast(`Badge: ${BADGES[id][0]}`); GK.sfx && GK.sfx("win"); }, 900); }
const worldUnlocked = i => { if (S.unlockAll || i === 0) return true; const prev = gameFor(UNITS[i - 1].id); const G = gameState(); return !!(prev && (G.lv[prev.id] || {})[3]); };
const levelUnlocked = (gid, lv) => lv === 1 || S.unlockAll || !!((gameState().lv[gid] || {})[lv - 1]);
const worldStars = gid => { const L = gameState().lv[gid] || {}; return [1, 2, 3, 4, 5].reduce((t, k) => t + (L[k] || 0), 0); };
function continueTarget() {
  for (let i = 0; i < UNITS.length; i++) { const g = gameFor(UNITS[i].id); if (!g || !worldUnlocked(i)) continue; const L = gameState().lv[g.id] || {}; for (let k = 1; k <= 5; k++) if (!L[k]) return { g, lv: k, u: UNITS[i] }; if (!gameState().boss[UNITS[i].id]) return { g, lv: "boss", u: UNITS[i] }; }
  return null;
}

/* ── island art (isometric tile, one per world) ── */

    ${[0, 1, 2].map(i => [0, 1, 2].map(j => `<polygon points="${60 + (i - j) * 14},${20 + (i + j) * 7} ${60 + (i - j + 1) * 14},${27 + (i + j) * 7} ${60 + (i - j) * 14},${34 + (i + j) * 7} ${60 + (i - j - 1) * 14},${27 + (i + j) * 7}" fill="rgba(13,16,34,${locked ? .25 : .12})" stroke="rgba(13,16,34,.25)" stroke-width=".8"/>`).join("")).join("")}

/* ── the runner ── */
let RUN = null;
function startGame(gid, lv) {

  RUN = { def, gid, unit: def.unit, lv, i: 0, hearts: 3, combo: 0, best: 0, score: 0, wins: 0, seed: (Date.now() ^ (Math.random() * 1e9)) >>> 0, cfg: def.levels[lv - 1], boss: false };

}
function bossDef(uid) {

    pool: shuffle(pool).map(i => i.key),
    gen(lv, r) { const key = this.pool[RUN.i % this.pool.length]; const it = ITEMS[key]; return { key, prompt: it.kind === "proof" ? "Fill the missing line of the proof." : (it.kind === "julia" ? "Julia Lab" : "Quiz question"), why: it.ref.why || (it.kind === "proof" ? "" : ""), stone: it.stone }; },

function startBoss(uid) {

function nextRound() { const r = GK.R.make(RUN.seed + RUN.i * 7919); RUN.round = RUN.def.gen.call(RUN.def, RUN.lv, r); RUN.locked = false; RUN.t0 = Date.now(); }

VIEWS.game = {
  html() {
    if (!RUN) return `<p>Pick a world first.</p>`;
    if (RUN.over) return runEnd();
    const cfg = RUN.cfg, n = cfg.rounds;
    return `<div class="hud"><button class="back" id="quit" aria-label="Leave level">×</button>

      <div class="hudmid"><div class="progress"><i style="width:${RUN.i / n * 100}%"></i></div><div class="small">${esc(RUN.boss ? RUN.def.title : RUN.def.title + " · " + cfg.name)} · ${RUN.i + 1}/${n}</div></div>

      ${cfg.time ? `<div class="timebar"><i id="tb"></i></div>` : ""}

      <div id="fb"></div><p class="small" id="quitMsg" hidden style="text-align:center">Tap × again to leave. This run won't count.</p>`;
  },
  mount(root) {

    let qa = false; $("#quit").onclick = () => { if (qa) { const u = RUN.unit; RUN = null; go(def.id.startsWith("boss") ? "world" : "world", { unit: u }); } else { qa = true; $("#quitMsg").hidden = false; } };
    const ctx = {
      level: RUN.lv, hue: unitById(RUN.unit).hue, Kit: GK, tex, rich,
      after: fn => afters.push(fn),
      lockButton(get) { const b = document.createElement("button"); b.className = "btn primary block lockin"; b.textContent = "Lock it in"; b.onclick = () => ctx.submit(get()); $("#lockwrap").appendChild(b); },
      submit(inp) {
        if (RUN.locked) return; RUN.locked = true; clearInterval(timer);
        let res; try { res = def.check(round, inp) || { ok: false }; } catch (e) { res = { ok: false }; }
        grade(res, round, afters, root);
      }
    };
    RUN.ctx = ctx;
    let timer = null;
    if (RUN.cfg.time) { const T = RUN.cfg.time * 1000; timer = setInterval(() => { const left = Math.max(0, T - (Date.now() - RUN.t0)); const tb = $("#tb"); if (tb) tb.style.width = (left / T * 100) + "%"; if (left <= 0) { clearInterval(timer); if (!RUN.locked) { RUN.locked = true; grade({ ok: false, why: "Time's up." }, round, afters, root); } } }, 100); cleanup.push(() => clearInterval(timer)); }
    let destroy = null; try { destroy = def.render(stage, round, ctx); } catch (e) { stage.innerHTML = `<p class="small">This round failed to draw (${esc(e.message)}). Tap Lock it in to skip.</p>`; ctx.lockButton(() => null); }
    if (typeof destroy === "function") cleanup.push(destroy);
    keyHandler = e => { if (/^[1-4]$/.test(e.key)) { const b = stage.querySelectorAll(".gchoice, .opt")[+e.key - 1]; if (b && !RUN.locked) b.click(); } else if (e.key === "Enter") { const nb = $("#nextBtn"); if (nb) nb.click(); else { const lb = root.querySelector(".lockin"); if (lb && !RUN.locked) lb.click(); } } };
  }
};
function grade(res, round, afters, root) {
  const ok = !!res.ok; const G = gameState();
  if (RUN.boss) record(round.key, ok);
  if (ok) { RUN.combo++; RUN.wins++; RUN.best = Math.max(RUN.best, RUN.combo); const mult = 1 + Math.min(RUN.combo - 1, 6) * 0.25; let pts = Math.round(100 * mult); if (RUN.cfg.time) pts += Math.round(Math.max(0, RUN.cfg.time * 1000 - (Date.now() - RUN.t0)) / 250); RUN.score += pts; GK.sfx(RUN.combo >= 3 ? "combo" : "good"); bumpQuest("rounds15");
    if (RUN.combo >= 5) { bumpQuest("combo5"); award("combo5"); } if (RUN.combo >= 10) award("combo10"); G.bestCombo = Math.max(G.bestCombo || 0, RUN.combo);
    var head = `+${pts}`; }

  root.querySelectorAll("#stage .gchoice.picked").forEach(b => b.classList.add(ok ? "right" : "wrong"));
  if (round.answer && typeof round.answer.pick === "number") { const cb = root.querySelectorAll("#stage .gchoice")[round.answer.pick]; if (cb) cb.classList.add("right"); }
  afters.forEach(f => { try { f(res); } catch (e) {} });
  const why = res.why || round.why || "";
  const st = round.stone ? stoneById(round.stone) : null;
  const stoneLink = (() => { const sid = st ? st.id : (RUN.def.stones || [])[0]; const s = sid && stoneById(sid); return s ? `<button class="chip unit" ${goAttr("stone", { unit: RUN.unit, i: stonesOf(RUN.unit).indexOf(s) })} style="min-height:36px">Review the stone: ${esc(s.title)}</button>` : ""; })();
  const card = root.querySelector("#gcard"); card.classList.add(ok ? "flash-ok" : "flash-no");
  root.querySelector(".hearts").innerHTML = [0, 1, 2].map(k => `<span class="${k < RUN.hearts ? "on" : ""} ${!ok && k === RUN.hearts ? "lost" : ""}">♥</span>`).join("");
  const cb = root.querySelector("#combo"); cb.textContent = "×" + Math.max(1, RUN.combo); cb.classList.toggle("hot", RUN.combo >= 2); if (ok && RUN.combo >= 2) { cb.classList.remove("bump"); void cb.offsetWidth; cb.classList.add("bump"); }
  root.querySelector("#lockwrap").innerHTML = "";
  root.querySelector("#fb").innerHTML = `<div class="gfb ${ok ? "ok" : "no"}"><div class="row"><b class="gh">${ok ? pickCheer() : "Not quite."}</b><span class="spacer"></span><b class="gpts">${head}</b></div>${why ? `<div class="gwhy">${rich(why)}</div>` : ""}${!ok ? stoneLink : ""}<button class="btn primary block" id="nextBtn">${RUN.hearts <= 0 || RUN.i + 1 >= RUN.cfg.rounds ? "See results" : "Next round"}</button></div>`;

  root.querySelector("#fb").scrollIntoView({ behavior: REDUCED ? "auto" : "smooth", block: "nearest" });
}
function finishRun() {

  const xp = Math.round(RUN.score / 10) + (won ? 40 : 0);

  else { const L = G.lv[RUN.gid] = G.lv[RUN.gid] || {}; if (won && stars > (L[RUN.lv] || 0)) { L[RUN.lv] = stars; newBest = true; } if (won) { bumpQuest("clear2"); award("first"); if (stars === 3) { bumpQuest("perfect1"); award("flawless"); } if (stars === 1) award("clutch"); } }

}
function runEnd() {
